name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: false

      - name: Build Clean
        run: |
          flutter create --project-name wana_lab_toolkit --org com.wanalab.toolkit --platforms=android . --overwrite
          rm -rf test
          python3 -c "import pathlib; p=pathlib.Path('android/app/build.gradle.kts'); t=p.read_text(); t=t.replace('flutter.minSdkVersion','23'); pathlib.Path('android/app/build.gradle.kts').write_text(t)"
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
