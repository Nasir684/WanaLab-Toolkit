plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.wanalab.toolkit"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.wanalab.toolkit"
        minSdk 21
        targetSdk 34
        versionCode 16
        versionName "2.1.0-VarRho"
        buildConfigField "String", "VAR_RHO_ENGINE", "\"v1.0-Research-IEEE-ASTM\""
        buildConfigField "String", "GITHUB_URL", "\"https://github.com/Nasir684/WanaLab-Toolkit\""
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
