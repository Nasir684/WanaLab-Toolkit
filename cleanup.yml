name: cleanup
on: workflow_dispatch
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clone without checkout to avoid filename too long
        run: |
          git clone --no-checkout https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Nasir/WanaLab-Toolkit.git repo
          cd repo
          git config user.name "Nasir Fix"
          git config user.email "fix@wanalab.com"
          
          # Remove corrupted lib folder from git index (not disk)
          git rm -r --cached lib || true
          git rm -r --cached android || true
          rm -rf lib android || true
          
          echo "# WanaLab Toolkit" > README.md
          echo "lib/" >> .gitignore
          echo "android/" >> .gitignore
          echo ".dart_tool/" >> .gitignore
          echo "build/" >> .gitignore
          
          git add README.md .gitignore
          git add -A
          git commit -m "EMERGENCY FIX: remove corrupted files with illegal names containing content"
          git push origin HEAD:main --force
          echo "✅ Corrupted files deleted"
