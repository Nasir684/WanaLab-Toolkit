name: restore_98_final
on:
  workflow_dispatch
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore 98 Tools FULL
        run: |
          python3 << 'PY'
          import pathlib, textwrap
          def W(p,c):
              fp=pathlib.Path(p)
              fp.parent.mkdir(parents=True, exist_ok=True)
              fp.write_text(textwrap.dedent(c).strip()+"\n")

          TOOLS = [
          ("gps_tracker","GPS Tracker", "gps_fixed"),
          ("offline_map","Offline Map","map"),
          ("compass","Compass","explore"),
          ("qibla_finder","Qibla Finder","mosque"),
          ("prayer_times","Prayer Times","access_time"),
          ("altitude","Altitude","terrain"),
          ("weather","Weather","cloud"),
          ("sun_calculator","Sun Calculator","wb_sunny"),
          ("moon_phase","Moon Phase","nightlight"),
          ("coordinates","Coordinates","my_location"),
          ("barcode_scanner","Barcode Scanner","qr_code_scanner"),
          ("qr_scanner","QR Scanner","qr_code"),
          ("qr_maker","QR Maker","qr_code_2"),
          ("ocr_text","OCR Text","text_fields"),
          ("nfc_reader","NFC Reader","nfc"),
          ("ble_scanner","BLE Scanner","bluetooth"),
          ("wifi_analyzer","WiFi Analyzer","wifi"),
          ("usb_info","USB Info","usb"),
          ("ir_remote","IR Remote","settings_remote"),
          ("magnetometer","Magnetometer","compass_calibration"),
          ("bmi_calculator","BMI Calculator","monitor_weight"),
          ("unit_converter","Unit Converter","swap_horiz"),
          ("calculator","Calculator","calculate"),
          ("age_calculator","Age Calculator","cake"),
          ("loan_calculator","Loan Calculator","account_balance"),
          ("tip_calculator","Tip Calculator","payments"),
          ("date_calculator","Date Calculator","date_range"),
          ("currency","Currency","currency_exchange"),
          ("length","Length Converter","straighten"),
          ("weight","Weight Converter","scale"),
          ("pdf_maker","PDF Maker","picture_as_pdf"),
          ("pdf_scanner","PDF Scanner","document_scanner"),
          ("zip_tool","ZIP Tool","folder_zip"),
          ("file_manager","File Manager","folder"),
          ("notes","Notes","note"),
          ("todo_list","Todo List","checklist"),
          ("voice_recorder","Voice Recorder","mic"),
          ("audio_player","Audio Player","audiotrack"),
          ("video_player","Video Player","video_library"),
          ("image_editor","Image Editor","image"),
          ("battery_info","Battery Info","battery_full"),
          ("device_info","Device Info","devices"),
          ("sensor_test","Sensor Test","sensors"),
          ("storage_analyzer","Storage Analyzer","storage"),
          ("ram_info","RAM Info","memory"),
          ("cpu_info","CPU Info","computer"),
          ("network_speed","Network Speed","speed"),
          ("flashlight","Flashlight","flashlight_on"),
          ("vibration","Vibration Test","vibration"),
          ("brightness","Brightness","brightness_6"),
          ("theme_engine","Theme Engine","palette"),
          ("icon_pack","Icon Pack","category"),
          ("wallpaper","Wallpaper","wallpaper"),
          ("font_viewer","Font Viewer","font_download"),
          ("color_picker","Color Picker","color_lens"),
          ("gradient_maker","Gradient Maker","gradient"),
          ("backup_restore","Backup Restore","backup"),
          ("app_locker","App Locker","lock"),
          ("permission_manager","Permission Manager","admin_panel_settings"),
          ("notification_history","Notification History","notifications"),
          ("timer","Timer","timer"),
          ("stopwatch","Stopwatch","timer_10"),
          ("alarm","Alarm","alarm"),
          ("world_clock","World Clock","public"),
          ("countdown","Countdown","hourglass_bottom"),
          ("pomodoro","Pomodoro","timelapse"),
          ("speedometer","Speedometer","speed"),
          ("level_tool","Level Tool","straighten"),
          ("ruler","Ruler","straighten"),
          ("protractor","Protractor","architecture"),
          ("translator","Translator","translate"),
          ("dictionary","Dictionary","menu_book"),
          ("morse_code","Morse Code","code"),
          ("binary_converter","Binary Converter","transform"),
          ("hash_generator","Hash Generator","fingerprint"),
          ("password_generator","Password Generator","key"),
          ("random_number","Random Number","casino"),
          ("dice_roller","Dice Roller","casino"),
          ("coin_flip","Coin Flip","toll"),
          ("lottery","Lottery","confirmation_number"),
          ("mqtt_client","MQTT Client","cloud_sync"),
          ("http_tester","HTTP Tester","http"),
          ("ping_tool","Ping Tool","network_ping"),
          ("port_scanner","Port Scanner","router"),
          ("ip_finder","IP Finder","language"),
          ("dns_lookup","DNS Lookup","dns"),
          ("whois","WHOIS","info"),
          ("user_agent","User Agent","computer"),
          ("json_formatter","JSON Formatter","data_object"),
          ("xml_viewer","XML Viewer","code"),
          ("health_tracker","Health Tracker","favorite"),
          ("step_counter","Step Counter","directions_walk"),
          ("heart_rate","Heart Rate","monitor_heart"),
          ("water_reminder","Water Reminder","water_drop"),
          ("expense_tracker","Expense Tracker","receipt_long"),
          ("habit_tracker","Habit Tracker","task_alt"),
          ("quote_day","Quote of Day","format_quote"),
          ("about","About","info_outline"),
          ]

          # Generate screens
          imports=""
          nav_cases=""
          for slug, title, icon in TOOLS:
              cname = "".join([w.capitalize() for w in slug.split("_")]) + "Screen"
              W(f"lib/features/{slug}_screen.dart", f"""
              import 'package:flutter/material.dart';
              class {cname} extends StatelessWidget {{
                const {cname}({{super.key}});
                @override Widget build(BuildContext context) {{
                  return Scaffold(
                    appBar: AppBar(title: Text('{title}'), backgroundColor: Color(0xFF2563EB), foregroundColor: Colors.white),
                    body: Center(
                      child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                        Icon(Icons.{icon}, size: 80, color: Color(0xFF2563EB)),
                        SizedBox(height: 20),
                        Text('{title}', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold)),
                        SizedBox(height: 10),
                        Text('WanaLab v3.4.45\\nTool #{TOOLS.index((slug,title,icon))+1} of 98\\nReady for implementation', textAlign: TextAlign.center),
                      ]),
                    ),
                  );
                }}
              }}
              """)
              imports += f"import '{slug}_screen.dart';\n"
              nav_cases += f"      '{slug}': (ctx) => {cname}(),\n"

          W("lib/features/dashboard_screen.dart", f"""
          import 'package:flutter/material.dart';
          {imports}
          class DashboardScreen extends StatelessWidget {{
            DashboardScreen({{super.key}});
            final tools = [
          """ + "\n".join([f"    {{'slug':'{s}','title':'{t}','icon':Icons.{i}}}," for s,t,i in TOOLS]) + """
            ];
            @override Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('WanaLab v3.4.45 - 98 Tools'), backgroundColor: Color(0xFF2563EB), foregroundColor: Colors.white),
                body: GridView.builder(
                  padding: EdgeInsets.all(8),
                  gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 3, childAspectRatio: 0.9, crossAxisSpacing: 6, mainAxisSpacing: 6),
                  itemCount: tools.length,
                  itemBuilder: (ctx,idx) {
                    final t = tools[idx];
                    return Card(
                      elevation: 2,
                      child: InkWell(
                        onTap: () {
                          final slug = t['slug'] as String;
                          Widget screen;
                          switch(slug) {
          """ + nav_cases + """
                            default: screen = Scaffold(appBar: AppBar(title: Text(t['title'] as String)), body: Center(child: Text(t['title'] as String)));
                          }
                          Navigator.push(context, MaterialPageRoute(builder: (_) => screen));
                        },
                        child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                          Icon(t['icon'] as IconData, color: Color(0xFF2563EB), size: 28),
                          SizedBox(height: 6),
                          Padding(padding: EdgeInsets.symmetric(horizontal: 4), child: Text(t['title'] as String, textAlign: TextAlign.center, style: TextStyle(fontSize: 9, fontWeight: FontWeight.bold))),
                          Text('#${idx+1}', style: TextStyle(fontSize: 8, color: Colors.grey)),
                        ]),
                      ),
                    );
                  },
                ),
              );
            }
          }
          """)
          print(f"Created {len(TOOLS)} screens")
          PY

      - name: Commit 98 screens
        run: |
          git config user.name "Nasir"
          git config user.email "nasir@wanalab.com"
          git add .
          git commit -m "Restore 98 Tools - Full screens with navigation" || echo "no changes"
          git push
