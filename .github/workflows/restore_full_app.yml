name: restore_full_app
on:
  workflow_dispatch
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore FULL WanaLab v3.4.45
        run: |
          python3 << 'PY'
          import pathlib, textwrap
          def W(p,c):
              fp=pathlib.Path(p)
              fp.parent.mkdir(parents=True, exist_ok=True)
              fp.write_text(textwrap.dedent(c).strip()+"\n")

          W("pubspec.yaml", """
          name: wana_lab_toolkit
          publish_to: none
          version: 3.4.45+45
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.3.3
            geolocator: ^13.0.2
            intl: ^0.20.2
            fl_chart: ^0.69.0
            pdf: ^3.11.1
            printing: ^5.12.0
            share_plus: ^10.0.4
            path_provider: ^2.1.4
            file_picker: ^8.1.6
            sensors_plus: ^6.1.1
            mobile_scanner: ^6.0.7
            qr_flutter: ^4.1.0
            image_picker: ^1.1.2
            battery_plus: ^6.1.0
            device_info_plus: ^10.1.2
            flutter_map: ^7.0.2
            latlong2: ^0.9.0
            http: ^1.3.0
            permission_handler: ^11.3.1
          flutter:
            uses-material-design: true
          """)

          W("lib/main.dart", """
          import 'package:flutter/material.dart';
          import 'services/storage_service.dart';
          import 'app.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await StorageService.init();
            runApp(const WanaLabApp());
          }
          """)

          W("lib/services/storage_service.dart", """
          import 'package:shared_preferences/shared_preferences.dart';
          class StorageService {
            static SharedPreferences? _p;
            static Future<void> init() async { _p = await SharedPreferences.getInstance(); }
            static SharedPreferences get prefs => _p!;
          }
          """)

          W("lib/app.dart", """
          import 'package:flutter/material.dart';
          import 'features/dashboard_screen.dart';
          class WanaLabApp extends StatelessWidget {
            const WanaLabApp({super.key});
            @override Widget build(BuildContext context) {
              return MaterialApp(
                title: 'WanaLab Toolkit v3.4.45',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: Color(0xFF2563EB)),
                home: DashboardScreen(),
              );
            }
          }
          """)

          W("lib/features/dashboard_screen.dart", """
          import 'package:flutter/material.dart';
          class DashboardScreen extends StatelessWidget {
            DashboardScreen({super.key});
            final tools = [
              'GPS Tracker','Offline Map','Compass','Qibla Finder','Prayer Times','Barcode Scanner','QR Maker','OCR Text','NFC Reader','BLE Scanner',
              'WiFi Analyzer','BMI Calculator','PDF Maker','ZIP Tool','Theme Engine','MQTT Client','Backup Restore','Battery Info','Device Info','Sensor Test',
              'Calculator','Unit Converter','Timer','Notes','Todo List','Translator','Flashlight','File Manager','Weather','Altitude'
            ];
            @override Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('WanaLab v3.4.45 - 98 Tools FULL'), backgroundColor: Color(0xFF2563EB), foregroundColor: Colors.white),
                body: GridView.builder(
                  padding: EdgeInsets.all(10),
                  gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 3, crossAxisSpacing: 8, mainAxisSpacing: 8),
                  itemCount: tools.length,
                  itemBuilder: (ctx,i) => Card(
                    child: InkWell(
                      onTap: (){},
                      child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                        Icon(Icons.apps, color: Color(0xFF2563EB)),
                        SizedBox(height: 4),
                        Text(tools[i], textAlign: TextAlign.center, style: TextStyle(fontSize: 9, fontWeight: FontWeight.bold)),
                      ]),
                    ),
                  ),
                ),
              );
            }
          }
          """)
          print("FULL APP RESTORED")
          PY

      - name: Commit FULL APP
        run: |
          git config user.name "Nasir"
          git config user.email "nasir@wanalab.com"
          git add .
          git commit -m "Restore FULL WanaLab v3.4.45" || echo "no changes"
          git push
