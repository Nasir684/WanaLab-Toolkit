name: emergency_fix
on:
  workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main(){ runApp(const MyApp()); }
          class MyApp extends StatelessWidget{
            const MyApp({super.key});
            @override Widget build(BuildContext context){
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  appBar: AppBar(title: Text('WanaLab TEST'), backgroundColor: Colors.blue, foregroundColor: Colors.white),
                  body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                    Icon(Icons.check_circle, size: 100, color: Colors.green),
                    SizedBox(height: 20),
                    Text('WanaLab Fixed!', style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold)),
                    Text('If you see this, crash is fixed', style: TextStyle(fontSize: 16)),
                  ])),
                ),
              );
            }
          }
          DART
          rm -rf lib/features lib/services lib/app.dart
          mkdir -p lib/features
          echo "Minimal main written"

      - run: |
          cat > pubspec.yaml << 'YAML'
          name: wana_lab_toolkit
          description: WanaLab
          publish_to: 'none'
          version: 1.0.0+99
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.2
          flutter:
            uses-material-design: true
          YAML

      - run: |
          git config user.name "Nasir"
          git config user.email "nasir@wanalab.com"
          git add .
          git commit -m "Emergency minimal - no imports" || echo "no change"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-TEST-Fixed
          path: build/app/outputs/flutter-apk/app-release.apk
