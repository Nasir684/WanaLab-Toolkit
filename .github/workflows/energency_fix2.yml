name: emergency_fix2
on:
  workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - run: |
          rm -rf android/ ios/ linux/ macos/ windows/ web/
          flutter create . --project-name wana_lab_toolkit --platforms android
          echo "Android recreated with correct package"

      - run: |
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main(){ runApp(const MyApp()); }
          class MyApp extends StatelessWidget{
            const MyApp({super.key});
            @override Widget build(BuildContext context){
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  appBar: AppBar(title: Text('WanaLab TEST FIXED'), backgroundColor: Colors.blue, foregroundColor: Colors.white),
                  body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                    Icon(Icons.check_circle, size: 100, color: Colors.green),
                    SizedBox(height: 20),
                    Text('WanaLab Fixed!', style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold)),
                    Text('Crash2 fix success', style: TextStyle(fontSize: 16)),
                  ])),
                ),
              );
            }
          }
          DART

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-TEST-Fixed-v2
          path: build/app/outputs/flutter-apk/app-release.apk
