name: WanaLab-FINAL-Clean-Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Backup WanaLab main.dart and pubspec.yaml
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp pubspec.lock /tmp/pubspec.lock.bak 2>/dev/null || true
          head -5 lib/main.dart
          echo "--- pubspec.yaml backed up ---"
          head -10 pubspec.yaml

      - name: Recreate Android project safely without losing dependencies
        run: |
          flutter create --platforms=android --org com.wanalab --project-name wanalab_toolkit . --overwrite
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          if [ -f /tmp/pubspec.lock.bak ]; then cp /tmp/pubspec.lock.bak pubspec.lock; fi
          echo "--- Restored ---"
          head -5 lib/main.dart
          grep -q "url_launcher" pubspec.yaml && echo "pubspec.yaml RESTORED OK - url_launcher found" || echo "ERROR pubspec not restored"

      - name: Build clean APK
        run: |
          flutter pub get
          flutter build apk --debug --build-name=2.1.0 --build-number=19

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: WanaLab-FINAL-FIXED-19-NO-BUG
          path: build/app/outputs/flutter-apk/app-debug.apk
