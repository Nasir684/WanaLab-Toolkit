name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Download (skip 1 broken file)
        run: |
          python3 - << 'PY'
          import tarfile, urllib.request, os
          url="https://github.com/Nasir684/WanaLab-Toolkit/archive/main.tar.gz"
          urllib.request.urlretrieve(url,"r.tar.gz")
          with tarfile.open("r.tar.gz","r:gz") as tar:
            for m in tar.getmembers():
              if "/" not in m.name: continue
              inner=m.name.split("/",1)[1]
              if "\n" in inner or '"' in inner or "content" in inner or len(inner)>120: continue
              if not (inner.startswith("lib/") or inner=="pubspec.yaml"): continue
              if not m.isfile(): continue
              d=os.path.dirname(inner)
              if d: os.makedirs(d,exist_ok=True)
              try: open(inner,"wb").write(tar.extractfile(m).read())
              except: pass
          PY

      - name: FIX - Force geolocator 12.0.0
        run: |
          echo "=== OLD pubspec.yaml ==="
          cat pubspec.yaml
          
          # Use Python to properly edit pubspec.yaml
          python3 - << 'PY'
          with open("pubspec.yaml","r") as f:
            content = f.read()
          # Force replace geolocator line
          import re
          content = re.sub(r'geolocator:.*', 'geolocator: ^12.0.0', content)
          content = re.sub(r'geolocator_android:.*', '', content)
          content = re.sub(r'geocoding:.*', 'geocoding: ^3.0.0', content)
          with open("pubspec.yaml","w") as f:
            f.write(content)
          print(content)
          PY
          
          echo "=== NEW pubspec.yaml ==="
          cat pubspec.yaml
          
          # VERY IMPORTANT: Delete lock file and rebuild
          rm -rf android pubspec.lock
          flutter create --project-name wana_lab_toolkit --org com.example.wanalab --platforms=android .
          flutter clean
          flutter pub upgrade --major-versions
          flutter pub get
          flutter pub deps | grep geolocator

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-APK
          path: build/app/outputs/flutter-apk/app-release.apk
