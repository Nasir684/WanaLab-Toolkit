name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.29.3', channel: 'stable'}

      - name: Build WanaLab v3.3 FULL - FIXED heredoc multiline
        run: |
          rm -rf android lib test pubspec.yaml pubspec.lock
          flutter create --project-name wana_lab_toolkit --org com.wanalab.toolkit --platforms=android .
          rm -rf test
          mkdir -p lib/services lib/features/sensors lib/features/camera lib/features/religion lib/features/language lib/features/phd lib/features/dev lib/features/detector assets
          pip3 install Pillow -q
          python3 -c "from PIL import Image,ImageDraw; img=Image.new('RGB',(1024,1024),(37,99,235)); ImageDraw.Draw(img).ellipse([180,180,844,844], fill='white'); img.save('assets/icon.png')"

          cat > pubspec.yaml << 'YAML'
          name: wana_lab_toolkit
          description: Research-oriented mobile platform for engineering estimation, EMI screening, detector analysis & scientific workflow support (evolution through 2037). Local-only, privacy-first, no login, no cloud. By Nasir Khan - https://github.com/Nasir684/WanaLab-Toolkit
          publish_to: 'none'
          version: 3.3.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.3.3
            geolocator: ^13.0.2
            intl: ^0.20.2
            pdf: ^3.11.1
            printing: ^5.12.0
            share_plus: ^10.0.4
            path_provider: ^2.1.4
            file_picker: ^8.1.6
            sensors_plus: ^6.1.1
            mobile_scanner: ^5.2.3
            qr_flutter: ^4.1.0
            image_picker: ^1.1.2
            google_mlkit_text_recognition: ^0.13.1
            adhan: ^2.0.0
            hijri: ^3.0.0
            url_launcher: ^6.2.5
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/icon.png
          YAML

          # Fix NDK + minSdk - fixes url_launcher_android 27.0.12077973
          python3 << 'PY'
          import pathlib, re
          p=pathlib.Path("android/app/build.gradle.kts")
          t=p.read_text()
          t=re.sub(r"minSdk = \d+", "minSdk = 23", t)
          t=t.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
          if "ndkVersion" not in t:
            t=t.replace("android {", 'android {\n    ndkVersion = "27.0.12077973"')
          else:
            t=re.sub(r'ndkVersion = ".*?"', 'ndkVersion = "27.0.12077973"', t)
          p.write_text(t)
          print(t[:600])
          PY

          # CORE - heredoc guarantees multiline - fixes 1:894 and 1:681
          cat > lib/services/storage_service.dart << 'DART'
          import 'package:shared_preferences/shared_preferences.dart';
          class StorageService {
            static SharedPreferences? _p;
            static Future<void> init() async {
              _p = await SharedPreferences.getInstance();
            }
            static Future<List<String>> getList(String k) async {
              return _p?.getStringList(k) ?? [];
            }
            static Future<void> setList(String k, List<String> v) async {
              await _p?.setStringList(k, v);
            }
            static Future<void> clearAll() async {
              await _p?.clear();
            }
          }
          DART

          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'services/storage_service.dart';
          import 'app.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await StorageService.init();
            runApp(const WanaLabApp());
          }
          DART

          cat > lib/app.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'features/dashboard_screen.dart';
          import 'features/core_screen.dart';
          import 'features/gps_screen.dart';
          import 'features/import_export_screen.dart';
          import 'features/settings_screen.dart';
          import 'features/about_screen.dart';
          import 'features/sensors/compass_screen.dart';
          import 'features/camera/barcode_screen.dart';
          import 'features/camera/ocr_screen.dart';
          import 'features/religion/qibla_screen.dart';
          import 'features/religion/prayer_screen.dart';
          import 'features/religion/tasbih_screen.dart';
          import 'features/religion/zakat_screen.dart';
          import 'features/language/translator_screen.dart';
          import 'features/phd/citation_screen.dart';
          import 'features/phd/statistics_screen.dart';
          import 'features/phd/notes_screen.dart';
          import 'features/phd/unit_converter_screen.dart';
          import 'features/dev/developer_screen.dart';
          import 'features/dev/pricing_screen.dart';
          import 'features/dev/demo_screen.dart';
          import 'features/dev/changelog_screen.dart';
          import 'features/dev/roadmap_screen.dart';
          import 'features/detector/emi_screen.dart';
          import 'features/detector/detector_screen.dart';

          class WanaLabApp extends StatelessWidget {
            const WanaLabApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'WanaLab FULL',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: const Color(0xFF2563EB)),
                home: const MainScaffold(),
              );
            }
          }

          class MainScaffold extends StatefulWidget {
            const MainScaffold({super.key});
            @override
            State<MainScaffold> createState() => _MainScaffoldState();
          }

          class _MainScaffoldState extends State<MainScaffold> {
            int idx = 0;
            void go(int i) => setState(() => idx = i);
            final titles = ["Dashboard","Core","GPS","Export","Settings","About","Compass","Barcode","OCR ML Kit","Qibla","Prayer","Tasbih","Zakat","Trans","Cite","Stats","Notes","Units","Author","Pricing","Demo","Changelog","Roadmap","EMI","Detector"];
            late final screens;
            @override
            void initState(){
              super.initState();
              screens=[DashboardScreen(onNav: go), const CoreScreen(), const GPSScreen(), const ImportExportScreen(), const SettingsScreen(), const AboutScreen(), const CompassScreen(), const BarcodeScreen(), const OCRScreen(), const QiblaScreen(), const PrayerScreen(), const TasbihScreen(), const ZakatScreen(), const TranslatorScreen(), const CitationScreen(), const StatisticsScreen(), const NotesScreen(), const UnitConverterScreen(), const DeveloperScreen(), const PricingScreen(), const DemoScreen(), const ChangelogScreen(), const RoadmapScreen(), const EMIScreen(), const DetectorScreen()];
            }
            @override
            Widget build(BuildContext context){
              return Scaffold(
                appBar: AppBar(title: Text(titles[idx]), centerTitle:true),
                body: idx==0? DashboardScreen(onNav: go): screens[idx],
                bottomNavigationBar: NavigationBar(
                  selectedIndex: idx>4?0:idx,
                  onDestinationSelected:(v){
                    if(v==0) setState(()=>idx=0);
                    if(v==1) setState(()=>idx=18);
                    if(v==2) setState(()=>idx=22);
                    if(v==3) setState(()=>idx=23);
                    if(v==4) setState(()=>idx=8);
                  },
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.dashboard), label:'Platform'),
                    NavigationDestination(icon: Icon(Icons.person), label:'Author'),
                    NavigationDestination(icon: Icon(Icons.map), label:'Roadmap'),
                    NavigationDestination(icon: Icon(Icons.electrical_services), label:'EMI'),
                    NavigationDestination(icon: Icon(Icons.text_fields), label:'OCR'),
                  ]
                )
              );
            }
          }
          DART

          cat > lib/features/dashboard_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          import '../services/storage_service.dart';
          class DashboardScreen extends StatefulWidget {
            final Function(int) onNav;
            const DashboardScreen({super.key, required this.onNav});
            @override State<DashboardScreen> createState()=> _DashboardState();
          }
          class _DashboardState extends State<DashboardScreen> {
            int cores=0;
            @override void initState(){ super.initState(); _load();}
            Future<void> _load() async { final c=await StorageService.getList('cores'); if(mounted) setState(()=> cores=c.length); }
            @override Widget build(BuildContext context){
              return ListView(padding: const EdgeInsets.all(8), children:[
                Card(color: const Color(0xFF2563EB), child: Padding(padding: const EdgeInsets.all(12), child: Text('WanaLab v3.3 FULL ALL CATEGORIES + OCR - Local-only - By Nasir Khan - github.com/Nasir684/WanaLab-Toolkit - Cores: $cores', style: const TextStyle(color:Colors.white, fontSize:10)))),
                _grid([_b('Core', Icons.terrain, Colors.green,1), _b('GPS', Icons.gps_fixed, Colors.blue,2), _b('Export', Icons.file_present, Colors.teal,3), _b('EMI', Icons.electrical_services, Colors.orange,23), _b('Detector', Icons.sensors, Colors.purple,24), _b('Compass', Icons.explore, Colors.red,6), _b('Barcode', Icons.qr_code_scanner, Colors.teal,7), _b('OCR', Icons.text_fields, Colors.purple,8), _b('Qibla', Icons.mosque, Colors.green,9), _b('Prayer', Icons.access_time, Colors.green,10), _b('Tasbih', Icons.circle, Colors.green,11), _b('Zakat', Icons.calculate, Colors.green,12)]),
              ]);
            }
            Widget _grid(List<Widget> c)=> GridView.count(crossAxisCount:3, shrinkWrap:true, physics: const NeverScrollableScrollPhysics(), children:c);
            Widget _b(String t, IconData ic, Color col, int i)=> InkWell(onTap: ()=> widget.onNav(i), child: Card(elevation:2, child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[Icon(ic,color:col,size:22), Text(t, style: const TextStyle(fontSize:9, fontWeight: FontWeight.bold))])) );
          }
          DART

          cat > lib/features/import_export_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          import '../services/storage_service.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:file_picker/file_picker.dart';
          import 'dart:io';
          import 'package:intl/intl.dart';

          class ImportExportScreen extends StatefulWidget {
            const ImportExportScreen({super.key});
            @override
            State<ImportExportScreen> createState() => _ImportExportState();
          }

          class _ImportExportState extends State<ImportExportScreen> {
            String status = 'Ready Local-only';
            String preview = '';

            Future<void> exportFile() async {
              final cores = await StorageService.getList('cores');
              final report = 'WanaLab v3.3 FULL\nDate: ${DateFormat('yyyy-MM-dd').format(DateTime.now())}\nCores:\n${cores.join('\n')}';
              final dir = await getTemporaryDirectory();
              final file = File('${dir.path}/Export.txt');
              await file.writeAsString(report);
              setState((){ status='Exported'; preview=report; });
              await Share.shareXFiles([XFile(file.path)]);
            }

            Future<void> importFile() async {
              try{
                FilePickerResult? r = await FilePicker.platform.pickFiles();
                if(r!=null){
                  File f = File(r.files.single.path!);
                  String content = await f.readAsString();
                  setState((){ status='Imported ${r.files.single.name}'; preview=content.substring(0, content.length>800?800:content.length); });
                }
              }catch(e){ setState(()=> status='Failed $e'); }
            }

            @override
            Widget build(BuildContext context){
              return ListView(
                padding: const EdgeInsets.all(12),
                children:[
                  Card(child: Padding(padding: const EdgeInsets.all(10), child: Text(status))),
                  FilledButton.icon(onPressed: exportFile, icon: const Icon(Icons.file_present), label: const Text('EXPORT TXT Local')),
                  FilledButton.tonalIcon(onPressed: importFile, icon: const Icon(Icons.file_upload), label: const Text('IMPORT')),
                  Container(padding: const EdgeInsets.all(8), color: Colors.grey.shade100, child: SelectableText(preview.isEmpty?'No data':preview, style: const TextStyle(fontSize:10))),
                ]
              );
            }
          }
          DART

          cat > lib/features/sensors/compass_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:sensors_plus/sensors_plus.dart';
          import 'dart:math';
          class CompassScreen extends StatefulWidget {
            const CompassScreen({super.key});
            @override State<CompassScreen> createState()=> _CompassState();
          }
          class _CompassState extends State<CompassScreen> {
            double heading=0;
            @override void initState(){
              super.initState();
              magnetometerEventStream().listen((e){
                double hh=atan2(e.y, e.x)*180/pi;
                if(hh<0) hh+=360;
                if(mounted) setState(()=> heading=hh);
              });
            }
            @override Widget build(BuildContext context){
              return ListView(padding: const EdgeInsets.all(20), children:[
                const Center(child: Icon(Icons.navigation, size:120, color: Colors.red)),
                Center(child: Text('${heading.toStringAsFixed(0)}°', style: const TextStyle(fontSize:32, fontWeight: FontWeight.bold))),
              ]);
            }
          }
          DART

          cat > lib/features/religion/prayer_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:adhan/adhan.dart';
          import 'package:intl/intl.dart';
          import 'package:geolocator/geolocator.dart';

          class PrayerScreen extends StatefulWidget {
            const PrayerScreen({super.key});
            @override State<PrayerScreen> createState()=> _PrayerState();
          }

          class _PrayerState extends State<PrayerScreen> {
            String t='Press Get Prayer Times Local-only';

            Future<void> getTimes() async {
              try{
                final pos=await Geolocator.getCurrentPosition();
                final coords=Coordinates(pos.latitude, pos.longitude);
                final params=CalculationMethod.karachi.getParameters();
                params.madhab=Madhab.hanafi;
                final prayer=PrayerTimes(coords, DateComponents.from(DateTime.now()), params);
                if(mounted){
                  setState((){
                    t='Fajr: ${DateFormat.jm().format(prayer.fajr)}\nDhuhr: ${DateFormat.jm().format(prayer.dhuhr)}\nAsr: ${DateFormat.jm().format(prayer.asr)}\nMaghrib: ${DateFormat.jm().format(prayer.maghrib)}\nIsha: ${DateFormat.jm().format(prayer.isha)}';
                  });
                }
              }catch(e){
                if(mounted) setState(()=> t='Enable GPS $e');
              }
            }

            @override Widget build(BuildContext context){
              return ListView(padding: const EdgeInsets.all(16), children:[
                FilledButton(onPressed: getTimes, child: const Text('Get Times GPS Local')),
                Card(child: Padding(padding: const EdgeInsets.all(16), child: Text(t, style: const TextStyle(fontSize:16)))),
              ]);
            }
          }
          DART

          # --- OTHER SCREENS - also heredoc multiline ---
          cat > lib/features/core_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          import '../services/storage_service.dart';
          import 'package:intl/intl.dart';
          import 'package:share_plus/share_plus.dart';
          class CoreScreen extends StatefulWidget { const CoreScreen({super.key}); @override State<CoreScreen> createState()=> _CoreState(); }
          class _CoreState extends State<CoreScreen> {
            final wt=TextEditingController(), wc=TextEditingController(text:'100'), vc=TextEditingController(text:'1000'), water=TextEditingController(), loc=TextEditingController();
            double bulk=0, dry=0; List<String> hist=[];
            @override void initState(){ super.initState(); _load();}
            Future<void> _load() async { hist=await StorageService.getList('cores'); if(mounted) setState((){});}
            void calc(){ double wT=double.tryParse(wt.text)??0, wC=double.tryParse(wc.text)??0, vC=double.tryParse(vc.text)??1000, w=double.tryParse(water.text)??0; if(wT==0||vC==0) return; bulk=(wT-wC)/vC; dry=bulk/(1+w/100); setState((){});}
            Future<void> save() async { hist.add("${DateFormat('dd-MM HH:mm').format(DateTime.now())} | ${loc.text}"); await StorageService.setList('cores', hist); if(mounted) setState((){});}
            @override Widget build(BuildContext context){ return ListView(padding: const EdgeInsets.all(10), children:[ TextField(controller: loc, decoration: const InputDecoration(labelText:'Location', border: OutlineInputBorder())), TextField(controller: wt, decoration: const InputDecoration(labelText:'Wt core+soil', border: OutlineInputBorder())), FilledButton(onPressed: calc, child: const Text('Calculate')), Text('Bulk: ${bulk.toStringAsFixed(3)}'), FilledButton.tonal(onPressed: save, child: const Text('Save')), OutlinedButton(onPressed: ()=> Share.share('Bulk: ${bulk.toStringAsFixed(3)}'), child: const Text('Share')) ]); }
          }
          DART

          cat > lib/features/gps_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';
