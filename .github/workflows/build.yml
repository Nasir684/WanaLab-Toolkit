name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup git long paths
        run: |
          git config --global core.longpaths true
          git config --global core.protectNTFS false
          git config --global core.fsmonitor false

      - name: Clone only lib and minimal android
        run: |
          git init .
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch --depth 1 origin main
          git sparse-checkout init --cone
          git sparse-checkout set lib android/app/src android/app/build.gradle android/build.gradle android/settings.gradle android/gradle pubspec.yaml pubspec.lock
          git checkout origin/main
          echo "Checked out files:"
          ls -la
          ls -la lib/
          ls -la android/app/src/main/

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create missing android files
        run: |
          if [ ! -f android/gradlew ]; then
            echo "gradlew missing, will be generated by flutter"
          fi
          rm -rf build .dart_tool android/.gradle android/app/build || true

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanaLab-APK-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
