name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.29.3', channel: 'stable'}

      - name: Build FULL WanaLab Toolkit
        run: |
          rm -rf android lib test pubspec.yaml pubspec.lock
          flutter create --project-name wana_lab_toolkit --org com.example.wanalab --platforms=android .
          rm -rf test
          mkdir -p lib/services lib/features

          cat > lib/services/storage_service.dart << 'DART'
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:convert';
          class StorageService {
            static SharedPreferences? _prefs;
            static Future<void> init() async { _prefs = await SharedPreferences.getInstance(); }
            static Future<List<String>> getList(String k) async => _prefs?.getStringList(k) ?? [];
            static Future<void> setList(String k, List<String> v) async => await _prefs?.setStringList(k, v);
            static Future<void> saveJson(String k, dynamic v) async => await _prefs?.setString(k, jsonEncode(v));
            static dynamic getJson(String k) { final s = _prefs?.getString(k); if(s==null) return null; try{return jsonDecode(s);}catch(_){return null;} }
            static Future<void> clearAll() async => await _prefs?.clear();
          }
          DART

          cat > pubspec.yaml << 'YAML'
          name: wana_lab_toolkit
          description: WanaLab Toolkit
          publish_to: 'none'
          version: 1.0.0+1
          environment: {sdk: '>=3.2.0 <4.0.0'}
          dependencies:
            flutter: {sdk: flutter}
            shared_preferences: ^2.3.3
            geolocator: ^13.0.2
            intl: ^0.20.2
          dev_dependencies: {flutter_test: {sdk: flutter}, flutter_lints: ^4.0.0}
          flutter: {uses-material-design: true}
          YAML

          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'services/storage_service.dart';
          import 'app.dart';
          void main() async { WidgetsFlutterBinding.ensureInitialized(); await StorageService.init(); runApp(const WanaLabApp()); }
          DART

          cat > lib/app.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'features/dashboard_screen.dart'; import 'features/core_screen.dart'; import 'features/gps_screen.dart'; import 'features/baby_screen.dart'; import 'features/emi_screen.dart'; import 'features/gym_screen.dart'; import 'features/workshop_screen.dart'; import 'features/varrho_screen.dart'; import 'features/import_export_screen.dart'; import 'features/settings_screen.dart'; import 'features/gallery_screen.dart'; import 'features/about_screen.dart';
          class WanaLabApp extends StatelessWidget { const WanaLabApp({super.key}); @override Widget build(BuildContext context) { return MaterialApp(title: 'WanaLab', debugShowCheckedModeBanner: false, theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.indigo), home: const MainScaffold()); } }
          class MainScaffold extends StatefulWidget { const MainScaffold({super.key}); @override State<MainScaffold> createState() => _MainState(); }
          class _MainState extends State<MainScaffold> {
            int idx=0;
            final screens=[const DashboardScreen(), const CoreScreen(), const GPSScreen(), const BabyScreen(), const EMIScreen(), const GymScreen(), const WorkshopScreen(), const VarRhoScreen(), const ImportExportScreen(), const SettingsScreen(), const GalleryScreen(), const AboutScreen()];
            final titles=["Dashboard","Core Cutter","GPS Logger","Baby Tracker","EMI Calc","Gym/BMI","Workshop","Var Rho","Data","Settings","Gallery","About"];
            @override Widget build(BuildContext context){ return Scaffold(appBar: AppBar(title: Text(titles[idx])), body: screens[idx], bottomNavigationBar: NavigationBar(selectedIndex: idx>4?0:idx, onDestinationSelected: (v)=>setState(()=>idx=v), destinations: const [NavigationDestination(icon: Icon(Icons.dashboard), label: 'Dash'), NavigationDestination(icon: Icon(Icons.science), label: 'Core'), NavigationDestination(icon: Icon(Icons.gps_fixed), label: 'GPS'), NavigationDestination(icon: Icon(Icons.child_friendly), label: 'Baby'), NavigationDestination(icon: Icon(Icons.calculate), label: 'EMI')]), drawer: Drawer(child: ListView(padding: EdgeInsets.zero, children: [DrawerHeader(decoration: const BoxDecoration(color: Colors.indigo), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [const Icon(Icons.biotech, size: 40, color: Colors.white), const SizedBox(height:10), Text(titles[idx], style: const TextStyle(color: Colors.white, fontSize: 20))])), ...List.generate(titles.length, (i)=>ListTile(title: Text(titles[i]), selected: i==idx, onTap: (){setState(()=>idx=i); Navigator.pop(context);} ))]))); }
          }
          DART

          cat > lib/features/dashboard_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart';
          class DashboardScreen extends StatefulWidget { const DashboardScreen({super.key}); @override State<DashboardScreen> createState()=>_D(); }
          class _D extends State<DashboardScreen> { int cores=0,gps=0; @override void initState(){super.initState(); _load();} Future<void> _load() async { final c=await StorageService.getList('cores'); final g=await StorageService.getList('gps'); if(!mounted) return; setState((){cores=c.length; gps=g.length;}); } @override Widget build(BuildContext context){ return ListView(padding: const EdgeInsets.all(16), children: [Card(child: Padding(padding: const EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [const Text('WanaLab Toolkit', style: TextStyle(fontSize:22, fontWeight: FontWeight.bold)), const SizedBox(height:8), const Text('All-in-one field lab toolkit'), const SizedBox(height:16), Row(children: [Expanded(child: _stat('Cores', '$cores')), const SizedBox(width:12), Expanded(child: _stat('GPS', '$gps'))])]))), const SizedBox(height:12), GridView.count(crossAxisCount:2, shrinkWrap:true, physics: const NeverScrollableScrollPhysics(), children: [_quick('Core Test','Soil density',Icons.science, Colors.green), _quick('GPS Logger','Save locations',Icons.gps_fixed, Colors.blue), _quick('EMI Calc','Loan EMI',Icons.calculate, Colors.orange), _quick('BMI/Gym','Health',Icons.fitness_center, Colors.purple)])]); } Widget _stat(String t,String v){ return Container(padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: Colors.indigo.shade50, borderRadius: BorderRadius.circular(12)), child: Column(children: [Text(v, style: const TextStyle(fontSize:18, fontWeight: FontWeight.bold)), Text(t)])); } Widget _quick(String a,String b,IconData ic,Color c){ return Card(child: Padding(padding: const EdgeInsets.all(12), child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(ic, color:c, size:32), const SizedBox(height:8), Text(a, style: const TextStyle(fontWeight: FontWeight.bold)), Text(b, style: const TextStyle(fontSize:12))]))); } }
          DART

          cat > lib/features/core_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart'; import 'package:intl/intl.dart';
          class CoreScreen extends StatefulWidget { const CoreScreen({super.key}); @override State<CoreScreen> createState()=>_C(); }
          class _C extends State<CoreScreen> { final wtCtrl=TextEditingController(), wcCtrl=TextEditingController(text:'100'), vcCtrl=TextEditingController(text:'1000'), wCtrl=TextEditingController(); double bulk=0,dry=0,mc=0; List<String> hist=[]; @override void initState(){super.initState(); _loadHist();} Future<void> _loadHist() async { hist=await StorageService.getList('cores'); if(mounted) setState((){}); } void calc(){ double wt=double.tryParse(wtCtrl.text)??0; double wc=double.tryParse(wcCtrl.text)??0; double vc=double.tryParse(vcCtrl.text)??1000; double w=double.tryParse(wCtrl.text)??0; if(wt==0||vc==0){ return; } bulk=(wt-wc)/vc; mc=w; dry=bulk/(1+mc/100); setState((){}); } Future<void> save() async { if(bulk==0){ return; } final f=DateFormat('dd-MM HH:mm').format(DateTime.now()); hist.add('$f | Bulk:${bulk.toStringAsFixed(3)} Dry:${dry.toStringAsFixed(3)}'); await StorageService.setList('cores', hist); setState((){}); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [TextField(controller: wtCtrl, decoration: const InputDecoration(labelText:'Wt. of core + soil (g)'), keyboardType: TextInputType.number), TextField(controller: wcCtrl, decoration: const InputDecoration(labelText:'Wt. of core (g)'), keyboardType: TextInputType.number), TextField(controller: vcCtrl, decoration: const InputDecoration(labelText:'Vol. of core (cc)'), keyboardType: TextInputType.number), TextField(controller: wCtrl, decoration: const InputDecoration(labelText:'Water content %'), keyboardType: TextInputType.number), const SizedBox(height:12), FilledButton(onPressed: calc, child: const Text('Calculate')), Card(child: Padding(padding: const EdgeInsets.all(12), child: Column(children: [Text('Bulk: ${bulk.toStringAsFixed(3)}'), Text('Dry: ${dry.toStringAsFixed(3)}')]))), FilledButton.tonal(onPressed: save, child: const Text('Save'))]); } }
          DART

          cat > lib/features/gps_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import 'package:geolocator/geolocator.dart'; import '../services/storage_service.dart';
          class GPSScreen extends StatefulWidget { const GPSScreen({super.key}); @override State<GPSScreen> createState()=>_G(); }
          class _G extends State<GPSScreen> { String loc='Press Get Location'; List<String> points=[]; @override void initState(){super.initState(); _load();} Future<void> _load() async { points=await StorageService.getList('gps'); if(mounted) setState((){}); } Future<void> getLoc() async { bool s=await Geolocator.isLocationServiceEnabled(); if(!s){ if(!mounted) return; setState(()=>loc='GPS disabled'); return;} LocationPermission p=await Geolocator.checkPermission(); if(p==LocationPermission.denied){ p=await Geolocator.requestPermission();} Position pos=await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high); if(!mounted) return; setState(()=>loc='${pos.latitude.toStringAsFixed(6)}, ${pos.longitude.toStringAsFixed(6)}'); } Future<void> saveP() async { if(loc.contains('Press')){ return; } points.add('${DateTime.now().toString().substring(0,19)} | $loc'); await StorageService.setList('gps', points); if(mounted) setState((){}); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [Card(child: Padding(padding: const EdgeInsets.all(16), child: Text(loc))), Row(children: [Expanded(child: FilledButton(onPressed: getLoc, child: const Text('Get Location'))), const SizedBox(width:12), Expanded(child: FilledButton.tonal(onPressed: saveP, child: const Text('Save')))]), Text('Saved: ${points.length}'), ...points.reversed.map((e)=>ListTile(dense:true, title: Text(e, style: const TextStyle(fontSize:11))))]); } }
          DART

          cat > lib/features/baby_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart';
          class BabyScreen extends StatefulWidget { const BabyScreen({super.key}); @override State<BabyScreen> createState()=>_B(); }
          class _B extends State<BabyScreen> { final w=TextEditingController(), h=TextEditingController(), a=TextEditingController(); List<String> hist=[]; double bmi=0; @override void initState(){super.initState(); _load();} Future<void> _load() async { hist=await StorageService.getList('baby'); if(mounted) setState((){}); } void calc(){ double ww=double.tryParse(w.text)??0; double hh=double.tryParse(h.text)??0; if(ww==0||hh==0){ return; } bmi=ww/((hh/100)*(hh/100)); setState((){}); } Future<void> save() async { if(bmi==0){ return; } hist.add('${a.text.isEmpty?'Baby':a.text}: ${w.text}kg, BMI:${bmi.toStringAsFixed(2)}'); await StorageService.setList('baby', hist); if(mounted) setState((){}); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [TextField(controller: a, decoration: const InputDecoration(labelText:'Name')), TextField(controller: w, decoration: const InputDecoration(labelText:'Weight kg'), keyboardType: TextInputType.number), TextField(controller: h, decoration: const InputDecoration(labelText:'Height cm'), keyboardType: TextInputType.number), FilledButton(onPressed: calc, child: const Text('Calculate')), Text('BMI: ${bmi.toStringAsFixed(2)}'), FilledButton.tonal(onPressed: save, child: const Text('Save'))]); } }
          DART

          cat > lib/features/emi_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import 'dart:math';
          class EMIScreen extends StatefulWidget { const EMIScreen({super.key}); @override State<EMIScreen> createState()=>_E(); }
          class _E extends State<EMIScreen> { final p=TextEditingController(text:'100000'), r=TextEditingController(text:'10'), n=TextEditingController(text:'12'); double emi=0,total=0,interest=0; void calc(){ double P=double.tryParse(p.text)??0; double R=double.tryParse(r.text)??0; double N=double.tryParse(n.text)??0; double mr=R/12/100; emi= P*mr*pow(mr+1,N)/(pow(mr+1,N)-1); total=emi*N; interest=total-P; setState((){}); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [TextField(controller: p, decoration: const InputDecoration(labelText:'Principal'), keyboardType: TextInputType.number), TextField(controller: r, decoration: const InputDecoration(labelText:'Rate %'), keyboardType: TextInputType.number), TextField(controller: n, decoration: const InputDecoration(labelText:'Months'), keyboardType: TextInputType.number), FilledButton(onPressed: calc, child: const Text('Calculate')), Text('EMI: ${emi.toStringAsFixed(2)}'), Text('Total: ${total.toStringAsFixed(2)}')]); } }
          DART

          cat > lib/features/gym_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          class GymScreen extends StatefulWidget { const GymScreen({super.key}); @override State<GymScreen> createState()=>_GY(); }
          class _GY extends State<GymScreen> { final w=TextEditingController(), h=TextEditingController(); double bmi=0; String cat=''; void calc(){ double ww=double.tryParse(w.text)??0; double hh=double.tryParse(h.text)??0; if(hh==0){ return; } bmi=ww/((hh/100)*(hh/100)); if(bmi<18.5){ cat='Underweight'; } else if(bmi<25){ cat='Normal'; } else if(bmi<30){ cat='Overweight'; } else { cat='Obese'; } setState((){}); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [TextField(controller: w, decoration: const InputDecoration(labelText:'Weight kg'), keyboardType: TextInputType.number), TextField(controller: h, decoration: const InputDecoration(labelText:'Height cm'), keyboardType: TextInputType.number), FilledButton(onPressed: calc, child: const Text('Calculate')), Text('BMI: ${bmi.toStringAsFixed(2)} $cat')]); } }
          DART

          cat > lib/features/workshop_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart';
          class WorkshopScreen extends StatefulWidget { const WorkshopScreen({super.key}); @override State<WorkshopScreen> createState()=>_W(); }
          class _W extends State<WorkshopScreen> { final c=TextEditingController(); List<String> items=[]; @override void initState(){super.initState(); _load();} Future<void> _load() async { items=await StorageService.getList('workshop'); if(mounted) setState((){}); } Future<void> add() async { if(c.text.isEmpty){ return; } items.add(c.text); await StorageService.setList('workshop', items); c.clear(); if(mounted) setState((){}); } @override Widget build(BuildContext cxt){ return ListView(padding: const EdgeInsets.all(16), children: [Row(children: [Expanded(child: TextField(controller: c, decoration: const InputDecoration(labelText:'Item'))), IconButton(onPressed: add, icon: const Icon(Icons.add))]), ...items.map((e)=>Card(child: ListTile(title: Text(e), trailing: IconButton(icon: const Icon(Icons.delete), onPressed: () async { items.remove(e); await StorageService.setList('workshop', items); if(mounted) setState((){}); })) )) ]); } }
          DART

          cat > lib/features/varrho_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          class VarRhoScreen extends StatefulWidget { const VarRhoScreen({super.key}); @override State<VarRhoScreen> createState()=>_V(); }
          class _V extends State<VarRhoScreen> { final rho=TextEditingController(text:'1.5'), varc=TextEditingController(text:'0.1'); double result=0; void calc(){ double r=double.tryParse(rho.text)??0; double v=double.tryParse(varc.text)??0; result=r*(1+v); setState((){}); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [TextField(controller: rho, decoration: const InputDecoration(labelText:'Rho'), keyboardType: TextInputType.number), TextField(controller: varc, decoration: const InputDecoration(labelText:'Var'), keyboardType: TextInputType.number), FilledButton(onPressed: calc, child: const Text('Correct')), Text('Result: ${result.toStringAsFixed(4)}')]); } }
          DART

          cat > lib/features/import_export_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart';
          class ImportExportScreen extends StatefulWidget { const ImportExportScreen({super.key}); @override State<ImportExportScreen> createState()=>_I(); }
          class _I extends State<ImportExportScreen> { String data=''; Future<void> exportAll() async { final cores=await StorageService.getList('cores'); final gps=await StorageService.getList('gps'); if(!mounted) return; setState(()=>data='CORES:\n${cores.join('\n')}\n\nGPS:\n${gps.join('\n')}'); } Future<void> clear() async { await StorageService.clearAll(); if(!mounted) return; setState(()=>data='All cleared!'); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [FilledButton(onPressed: exportAll, child: const Text('Export')), FilledButton.tonal(onPressed: clear, child: const Text('Clear All')), SelectableText(data)]); } }
          DART

          cat > lib/features/settings_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart';
          class SettingsScreen extends StatelessWidget { const SettingsScreen({super.key}); @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [ListTile(title: const Text('Clear All Data'), trailing: const Icon(Icons.delete_forever, color: Colors.red), onTap: () async { await StorageService.clearAll(); if(!c.mounted) return; ScaffoldMessenger.of(c).showSnackBar(const SnackBar(content: Text('Cleared'))); }), const ListTile(title: Text('Version'), subtitle: Text('1.0.0+1 WanaLab'))]); } }
          DART

          cat > lib/features/gallery_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          class GalleryScreen extends StatelessWidget { const GalleryScreen({super.key}); @override Widget build(BuildContext c){ return GridView.count(crossAxisCount:2, padding: const EdgeInsets.all(16), children: List.generate(6, (i)=>Card(child: Center(child: Text('Sample ${i+1}'))))); } }
          DART

          cat > lib/features/about_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          class AboutScreen extends StatelessWidget { const AboutScreen({super.key}); @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: const [Icon(Icons.biotech, size:80, color: Colors.indigo), SizedBox(height:16), Text('WanaLab Toolkit', textAlign: TextAlign.center, style: TextStyle(fontSize:24, fontWeight: FontWeight.bold)), Text('All-in-one toolkit', textAlign: TextAlign.center)]); } }
          DART

          flutter pub get
          flutter analyze || true

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-FULL-Toolkit-APK
          path: build/app/outputs/flutter-apk/app-release.apk
