name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Safe download - skip long files completely
        run: |
          python3 - << 'PY'
          import tarfile, urllib.request, os
          url = "https://github.com/Nasir684/WanaLab-Toolkit/archive/main.tar.gz"
          print("Downloading tarball...")
          urllib.request.urlretrieve(url, "repo.tar.gz")
          print("Extracting only safe folders...")
          with tarfile.open("repo.tar.gz", "r:gz") as tar:
              for m in tar.getmembers():
                  # Remove top folder WanaLab-Toolkit-main/
                  if "/" not in m.name:
                      continue
                  inner = m.name.split("/",1)[1]
                  if not (inner.startswith("lib/") or inner.startswith("android/") or inner == "pubspec.yaml"):
                      continue
                  if len(inner) > 120:
                      print(f"SKIPPED long file: {inner[:80]}...")
                      continue
                  m.name = inner
                  if m.isdir():
                      os.makedirs(inner, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(inner), exist_ok=True)
                      f = tar.extractfile(m)
                      if f:
                          open(inner, "wb").write(f.read())
          print("Done safe extract")
          PY
          ls -la
          ls -la lib/

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-APK
          path: build/app/outputs/flutter-apk/app-release.apk
