name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Build WanaLab v3.4 FULL FIX
        run: |
          set -e

          # Clean and create fresh project
          rm -rf android lib test pubspec.yaml pubspec.lock
          flutter create --project-name wana_lab_toolkit --org com.wanalab.toolkit --platforms=android .
          rm -rf test

          # Create folders
          mkdir -p lib/services \
                   lib/features/sensors \
                   lib/features/camera \
                   lib/features/religion \
                   lib/features/language \
                   lib/features/phd \
                   lib/features/dev \
                   lib/features/detector \
                   assets

          # Create icon
          pip3 install Pillow -q
          python3 -c "
from PIL import Image, ImageDraw
i = Image.new('RGB', (1024, 1024), (37, 99, 235))
ImageDraw.Draw(i).ellipse([180, 180, 844, 844], fill='white')
i.save('assets/icon.png')
"

          # ---------- pubspec.yaml ----------
          cat > pubspec.yaml << 'YAML'
          name: wana_lab_toolkit
          description: Research-oriented platform for engineering estimation, EMI screening, detector analysis & scientific workflow support. Local-only, privacy-first.
          publish_to: 'none'
          version: 3.4.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.3.3
            geolocator: ^13.0.2
            intl: ^0.20.2
            pdf: ^3.11.1
            printing: ^5.12.0
            share_plus: ^10.0.4
            path_provider: ^2.1.4
            file_picker: ^8.1.6
            sensors_plus: ^6.1.1
            mobile_scanner: ^5.2.3
            qr_flutter: ^4.1.0
            image_picker: ^1.1.2
            google_mlkit_text_recognition: ^0.13.1
            adhan: ^2.0.0
            hijri: ^3.0.0
            url_launcher: ^6.2.5
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/icon.png
          YAML

          # ---------- NDK + disable R8 ----------
          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path("android/app/build.gradle.kts")
          t = p.read_text()

          t = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", t)
          t = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 23", t)

          if "ndkVersion" not in t:
              t = t.replace("android {", 'android {\n    ndkVersion = "27.0.12077973"')
          else:
              t = re.sub(r'ndkVersion\s*=\s*".*?"', 'ndkVersion = "27.0.12077973"', t)

          t = re.sub(r"isMinifyEnabled\s*=\s*true", "isMinifyEnabled = false", t)
          t = re.sub(r"isShrinkResources\s*=\s*true", "isShrinkResources = false", t)

          if "isMinifyEnabled = false" not in t:
              t = t.replace(
                  "buildTypes {",
                  "buildTypes {\n        release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n        }"
              )

          p.write_text(t)
          print("=== build.gradle.kts fixed ===")
          print(t[:800])

          pathlib.Path("android/app/proguard-rules.pro").write_text(
              "-keep class com.google.mlkit.** { *; }\n"
              "-keep class com.google.android.gms.** { *; }\n"
              "-dontwarn com.google.mlkit.**\n"
          )
          PY

          # ---------- storage_service.dart ----------
          cat > lib/services/storage_service.dart << 'DART'
          import 'package:shared_preferences/shared_preferences.dart';

          class StorageService {
            static SharedPreferences? _p;

            static Future<void> init() async {
              _p = await SharedPreferences.getInstance();
            }

            static Future<List<String>> getList(String k) async {
              return _p?.getStringList(k) ?? [];
            }

            static Future<void> setList(String k, List<String> v) async {
              await _p?.setStringList(k, v);
            }

            static Future<void> clearAll() async {
              await _p?.clear();
            }
          }
          DART

          # ---------- main.dart ----------
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'services/storage_service.dart';
          import 'app.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await StorageService.init();
            runApp(const WanaLabApp());
          }
          DART

          # ---------- Helper: simple screen generator ----------
          # We generate all missing screens as simple stubs so the project compiles

          create_simple_screen() {
            local path="$1"
            local class_name="$2"
            local title="$3"
            cat > "$path" << DART
          import 'package:flutter/material.dart';

          class $class_name extends StatelessWidget {
            const $class_name({super.key});

            @override
            Widget build(BuildContext context) {
              return Center(
                child: Text(
                  '$title',
                  style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold),
                ),
              );
            }
          }
          DART
          }
