          w("lib/services/notification_service.dart","import 'package:flutter_local_notifications/flutter_local_notifications.dart'; import 'package:home_widget/home_widget.dart'; import 'package:shared_preferences/shared_preferences.dart'; class NotificationService { static final FlutterLocalNotificationsPlugin plugin=FlutterLocalNotificationsPlugin(); static Future<void> init() async { const AndroidInitializationSettings android=AndroidInitializationSettings('@mipmap/launcher_icon'); const InitializationSettings settings=InitializationSettings(android: android); await plugin.initialize(settings); final androidPlugin=plugin.resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>(); try{ await androidPlugin?.requestNotificationsPermission(); await androidPlugin?.requestExactAlarmsPermission(); }catch(_){} try{ await HomeWidget.setAppGroupId('group.wanalab'); }catch(_){} } static Future<void> updateWidget(String title, String data) async { try{ final p=await SharedPreferences.getInstance(); await p.setString('widget_title', title); await p.setString('widget_data', data); await p.setString('widget_time', DateTime.now().toString().substring(0,16)); await HomeWidget.saveWidgetData<String>('widget_title', title); await HomeWidget.saveWidgetData<String>('widget_data', data); await HomeWidget.saveWidgetData<String>('widget_time', DateTime.now().toString().substring(0,16)); await HomeWidget.updateWidget(name: 'HomeWidgetProvider', qualifiedAndroidName: 'es.antonborri.home_widget.HomeWidgetProvider'); }catch(_){} } }")
          w("lib/main.dart","import 'package:flutter/material.dart'; import 'services/storage_service.dart'; import 'services/notification_service.dart'; import 'app.dart'; import 'package:home_widget/home_widget.dart'; import 'package:workmanager/workmanager.dart'; import 'package:shared_preferences/shared_preferences.dart'; @pragma('vm:entry-point') void callbackDispatcher() { Workmanager().executeTask((task, inputData) async { try{ final p=await SharedPreferences.getInstance(); String title=p.getString('widget_title')??'WanaLab'; String data=p.getString('widget_data')??'GPS + EMI'; await HomeWidget.saveWidgetData<String>('widget_title', title); await HomeWidget.saveWidgetData<String>('widget_data', '$data - ${DateTime.now().toString().substring(11,16)}'); await HomeWidget.saveWidgetData<String>('widget_time', DateTime.now().toString().substring(0,16)); await HomeWidget.updateWidget(name: 'HomeWidgetProvider', qualifiedAndroidName: 'es.antonborri.home_widget.HomeWidgetProvider'); }catch(_){} return Future.value(true); }); } void main() async { WidgetsFlutterBinding.ensureInitialized(); await StorageService.init(); await NotificationService.init(); try{ await Workmanager().initialize(callbackDispatcher, isInDebugMode: false); await Workmanager().registerPeriodicTask('wana_widget_update', 'widgetUpdate', frequency: Duration(minutes: 30), existingWorkPolicy: ExistingWorkPolicy.keep); }catch(_){} try{ final p=await SharedPreferences.getInstance(); String title=p.getString('widget_title')??'WanaLab'; String data=p.getString('widget_data')??'GPS + EMI - Started'; await NotificationService.updateWidget(title, data); }catch(_){} runApp(const WanaLabApp()); }")
