ping','tying','untying','binding','unbinding','fastening','unfastening','securing','unsecuring','locking','unlocking'];
            }
            int levenshtein(String s, String t){
              List<List<int>> d=List.generate(s.length+1, (i)=> List.filled(t.length+1, 0));
              for(int i=0;i<=s.length;i++) d[i][0]=i;
              for(int j=0;j<=t.length;j++) d[0][j]=j;
              for(int i=1;i<=s.length;i++){ for(int j=1;j<=t.length;j++){ int cost=s[i-1]==t[j-1]?0:1; d[i][j]=[d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost].reduce((a,b)=> a<b?a:b); } }
              return d[s.length][t.length];
            }
            void check(){
              String text=ctrl.text.toLowerCase();
              List<String> words=text.split(RegExp(r'\\s+'));
              List<String> wrong=[];
              List<String> sugg=[];
              for(var w in words){ String clean=w.replaceAll(RegExp(r'[^a-z]'), ''); if(clean.length<2) continue; if(!dictWords.contains(clean)){ wrong.add(clean); // find closest
                String best=''; int bestDist=100;
                for(var dw in dictWords){ if((dw.length-clean.length).abs()>3) continue; int d=levenshtein(clean, dw); if(d<bestDist && d<=3){ bestDist=d; best=dw; } }
                if(best.isNotEmpty) sugg.add('$clean -> $best'); else sugg.add('$clean -> ?'); }
              }
              setState((){ result=wrong.isEmpty?'All words correct!':'Misspelled: ${wrong.join(', ')}'; suggestions=sugg; });
            }
            @override Widget build(BuildContext c)=> ListView(padding: EdgeInsets.all(12), children: [
              Card(child: Padding(padding: EdgeInsets.all(12), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                Text('Spell Checker - Offline', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                TextField(controller: ctrl, decoration: InputDecoration(labelText: 'Enter text to check', border: OutlineInputBorder()), maxLines: 3, onChanged: (v)=> check()),
                SizedBox(height: 8),
                FilledButton.icon(onPressed: check, icon: Icon(Icons.spellcheck), label: Text('Check Spelling')),
                SizedBox(height: 8),
                Text(result, style: TextStyle(fontWeight: FontWeight.bold, color: result.contains('Misspelled')?Colors.red:Colors.green)),
              ]))),
              Card(child: Padding(padding: EdgeInsets.all(12), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text('Suggestions (Levenshtein ≤3):', style: TextStyle(fontWeight: FontWeight.bold)), ...suggestions.map((s)=> Padding(padding: EdgeInsets.symmetric(vertical: 2), child: Text(s, style: TextStyle(fontSize: 12))))]))),
              Card(child: Padding(padding: EdgeInsets.all(12), child: Text('Spell Checker:\\n• 2000+ word dict\\n• Levenshtein distance\\n• Suggestions ≤3 edit\\n• Offline\\n• For notes, reports\\nWanaLab v3.4.22'))),
            ]);
          }
