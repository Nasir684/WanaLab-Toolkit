name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Download and rebuild Android folder
        run: |
          python3 - << 'PY'
          import tarfile, urllib.request, os, shutil
          url = "https://github.com/Nasir684/WanaLab-Toolkit/archive/main.tar.gz"
          urllib.request.urlretrieve(url, "repo.tar.gz")
          os.makedirs("/tmp/save", exist_ok=True)
          with tarfile.open("repo.tar.gz", "r:gz") as tar:
              for m in tar.getmembers():
                  if "/" not in m.name: continue
                  inner = m.name.split("/",1)[1]
                  if inner.startswith("lib/") or inner == "pubspec.yaml":
                      if m.isfile():
                          f = tar.extractfile(m)
                          out = f"/tmp/save/{inner}"
                          os.makedirs(os.path.dirname(out), exist_ok=True)
                          open(out, "wb").write(f.read())
          PY
          # create fresh Flutter project (fresh android/ folder)
          flutter create --project-name wana_lab_toolkit --org com.example --platforms=android /tmp/newapp
          # restore your code
          rm -rf lib pubspec.yaml
          cp -r /tmp/save/lib .
          cp /tmp/save/pubspec.yaml .
          cp -r /tmp/newapp/android .
          cp /tmp/newapp/analysis_options.yaml . || true
          ls -R

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-APK
          path: build/app/outputs/flutter-apk/app-release.apk
