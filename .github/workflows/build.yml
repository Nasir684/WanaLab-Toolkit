          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle
          sed -i 's/minSdkVersion 16/minSdkVersion 23/g' android/app/build.gradle
          sed -i 's/minSdkVersion 19/minSdkVersion 23/g' android/app/build.gradle
          sed -i 's/minSdkVersion 21/minSdkVersion 23/g' android/app/build.gradle
          grep minSdkVersion android/app/build.gradle

      - name: Pub Get
        run: flutter pub get

      - name: Build APK FULL ALL CATEGORIES WITH OCR
        run: |
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload FULL APK
        uses: actions/upload-artifact@v4
        with:
          name: WanaLab-v3.1-FULL-ALL-CATEGORIES-WITH-OCR-NOT-MINIMAL-FIXED
          path: build/app/outputs/flutter-apk/app-release.apk
