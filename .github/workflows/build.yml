name: build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Build WanaLab v3.5 FULL
        run: |
          flutter create . --project-name wanalab --org com.wanalab --platforms android
          mkdir -p lib/features/sensors lib/features/camera lib/features/religion lib/features/language lib/features/phd lib/features/dev lib/features/detector lib/services assets
          pip install pillow -q
          python3 -c "from PIL import Image; im=Image.new('RGB',(1024,1024),(37,99,235)); im.save('assets/icon.png')"

          python3 << 'PY'
          import pathlib, re, textwrap, os

          # --- PUBSPEC ---
          pathlib.Path("pubspec.yaml").write_text(textwrap.dedent("""
          name: wanalab
          description: WanaLab Toolkit - Research platform local-only
          publish_to: 'none'
          version: 3.5.0+35
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            geolocator: ^10.1.0
            sensors_plus: ^6.0.1
            mobile_scanner: ^5.2.3
            image_picker: ^1.1.2
            google_mlkit_text_recognition: ^0.13.1
            adhan: ^2.0.0+1
            hijri: ^3.0.0
            intl: ^0.19.0
            path_provider: ^2.1.2
            share_plus: ^7.2.2
            csv: ^6.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/icon.png
          """))

          # --- GRADLE FIXES ---
          pathlib.Path("android/gradle.properties").write_text("org.gradle.jvmargs=-Xmx4G\nandroid.useAndroidX=true\nandroid.enableJetifier=true\nandroid.enableR8.fullMode=false\nandroid.nonTransitiveRClass=false\nandroid.nonFinalResIds=false\n")
          pathlib.Path("android/app/proguard-rules.pro").write_text("-keep class io.flutter.app.** { *; }\n-keep class io.flutter.plugin.** { *; }\n-dontwarn **\n")

          f = pathlib.Path("android/app/build.gradle.kts")
          t = f.read_text()
          t = t.replace('isMinifyEnabled = true', 'isMinifyEnabled = false').replace('isShrinkResources = true', 'isShrinkResources = false')
          if 'ndkVersion' not in t:
              t = t.replace('namespace =', 'ndkVersion = "27.0.12077973"\n    namespace =')
          else:
              t = re.sub(r'ndkVersion = ".*?"', 'ndkVersion = "27.0.12077973"', t)
          f.write_text(t)

          # --- HELPER to make screen ---
          def mk(path, name, icon="info"):
              pathlib.Path(path).write_text(f"""
          import 'package:flutter/material.dart';
          class {name} extends StatelessWidget {{
            const {name}({{super.key}});
            @override Widget build(BuildContext c) => Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.{icon}, size:60), const SizedBox(height:12), Text("{name}"), Text("Local only", style: TextStyle(color: Colors.white70, fontSize: 11)), SizedBox(height:12), Wrap(spacing:10, children:[ FilledButton.icon(onPressed: (){{}}, icon: Icon(Icons.check), label: Text("OK")) ])]));
          }}
          """)

          # SERVICES
          pathlib.Path("lib/services/storage_service.dart").write_text("import 'package:shared_preferences/shared_preferences.dart';\nclass StorageService{static Future<void> setList(String k, List<String> v) async {final p=await SharedPreferences.getInstance(); await p.setStringList(k,v);} static Future<List<String>> getList(String k) async {final p=await SharedPreferences.getInstance(); return p.getStringList(k) ?? [];}}\n")
          pathlib.Path("lib/main.dart").write_text("import 'package:flutter/material.dart';import 'app.dart';void main(){WidgetsFlutterBinding.ensureInitialized();runApp(const WanaLabApp());}\n")

          # ALL 24 SCREENS - MERGED FIRST
          files = [
              ("lib/features/dashboard_screen.dart","DashboardScreen","dashboard", True),
              ("lib/features/core_screen.dart","CoreScreen","memory"),
              ("lib/features/gps_screen.dart","GPSScreen","gps_fixed"),
              ("lib/features/import_export_screen.dart","ImportExportScreen","import_export"),
              ("lib/features/settings_screen.dart","SettingsScreen","settings"),
              ("lib/features/about_screen.dart","AboutScreen","info"),
              ("lib/features/sensors/compass_screen.dart","CompassScreen","explore"),
              ("lib/features/camera/barcode_screen.dart","BarcodeScreen","qr_code"),
              ("lib/features/camera/ocr_screen.dart","OCRScreen","text_fields"),
              ("lib/features/religion/qibla_screen.dart","QiblaScreen","mosque"),
              ("lib/features/religion/prayer_screen.dart","PrayerScreen","access_time"),
              ("lib/features/religion/tasbih_screen.dart","TasbihScreen","repeat"),
              ("lib/features/religion/zakat_screen.dart","ZakatScreen","calculate"),
              ("lib/features/language/translator_screen.dart","TranslatorScreen","translate"),
              ("lib/features/phd/citation_screen.dart","CitationScreen","book"),
              ("lib/features/phd/statistics_screen.dart","StatisticsScreen","bar_chart"),
              ("lib/features/phd/notes_screen.dart","NotesScreen","note"),
              ("lib/features/phd/unit_converter_screen.dart","UnitConverterScreen","swap_horiz"),
              ("lib/features/dev/developer_screen.dart","DeveloperScreen","code"),
              ("lib/features/dev/pricing_screen.dart","PricingScreen","payments"),
              ("lib/features/dev/demo_screen.dart","DemoScreen","play_arrow"),
              ("lib/features/dev/changelog_screen.dart","ChangelogScreen","history"),
              ("lib/features/dev/roadmap_screen.dart","RoadmapScreen","map"),
              ("lib/features/detector/emi_screen.dart","EMIScreen","sensors"),
              ("lib/features/detector/detector_screen.dart","DetectorScreen","radar"),
          ]

          for item in files:
              path, cls, ic = item[0], item[1], item[2]
              is_dash = len(item)>3
              if is_dash:
                  pathlib.Path(path).write_text("""
          import 'package:flutter/material.dart';
          class DashboardScreen extends StatelessWidget {
            final Function(int) onNav;
            const DashboardScreen({super.key, required this.onNav});
            @override Widget build(BuildContext c){
              return ListView(padding: EdgeInsets.all(16), children: [
                Text("WanaLab v3.5 - Local Research Toolkit", style: TextStyle(fontSize:18, fontWeight: FontWeight.bold)),
                SizedBox(height:12),
                Wrap(spacing:10, runSpacing:10, children:[
                  FilledButton(onPressed: ()=>onNav(1), child: Text("Core")), FilledButton(onPressed: ()=>onNav(2), child: Text("GPS")),
                  FilledButton(onPressed: ()=>onNav(6), child: Text("Compass")), FilledButton(onPressed: ()=>onNav(9), child: Text("Qibla")),
                ])
              ]);
            }
          }
          """)
              else:
                  mk(path, cls, ic)

          # APP.DART
          pathlib.Path("lib/app.dart").write_text("""
          import 'package:flutter/material.dart';
          import 'features/dashboard_screen.dart';import 'features/core_screen.dart';import 'features/gps_screen.dart';import 'features/import_export_screen.dart';import 'features/settings_screen.dart';import 'features/about_screen.dart';import 'features/sensors/compass_screen.dart';import 'features/camera/barcode_screen.dart';import 'features/camera/ocr_screen.dart';import 'features/religion/qibla_screen.dart';import 'features/religion/prayer_screen.dart';import 'features/religion
