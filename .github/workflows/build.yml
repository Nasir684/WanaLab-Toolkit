name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.29.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: false

      - name: Fix assembleRelease error - CLEAN + NDK + ANALYZE
        run: |
          flutter clean
          rm -rf build/ android/app/build/ ~/.gradle/caches/ pubspec.lock
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" || true
          flutter doctor -v
          flutter pub get
          flutter analyze || true

      - name: Build v3.4.39 FINAL
        run: |
          rm -rf android lib test
          flutter create --project-name wana_lab_toolkit --org com.wanalab.toolkit --platforms=android .
          rm -rf test
          mkdir -p lib/services lib/features/widgetx lib/features/backup lib/features/fileman lib/features/iot lib/features/health lib/features/adv_sensors lib/features/permissions lib/features/dict lib/features/report lib/features/calendar lib/features/weather lib/features/ui_extras lib/features/labinst lib/features/edu lib/features/sensors lib/features/camera lib/features/religion lib/features/language lib/features/phd lib/features/dev lib/features/detector lib/features/hardware lib/features/gps lib/features/pro lib/features/audio lib/features/network lib/features/security
          cat > pubspec.yaml << 'YAML'
          name: wana_lab_toolkit
          publish_to: 'none'
          version: 3.4.39+40
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter: {sdk: flutter}
            shared_preferences: ^2.3.3
            geolocator: ^13.0.2
            intl: ^0.20.2
            pdf: ^3.11.1
            printing: ^5.12.0
            share_plus: ^10.0.4
            path_provider: ^2.1.4
            file_picker: ^8.1.6
            sensors_plus: ^6.1.1
            mobile_scanner: ^6.0.7
            qr_flutter: ^4.1.0
            image_picker: ^1.1.2
            google_mlkit_text_recognition: ^0.13.1
            google_mlkit_object_detection: ^0.13.0
            image_cropper: ^8.0.2
            adhan: ^2.0.0+1
            hijri: ^3.0.0
            fl_chart: ^0.69.0
            nfc_manager: ^3.4.0
            flutter_blue_plus: ^1.32.12
            battery_plus: ^6.1.0
            device_info_plus: ^10.1.2
            flutter_map: ^7.0.2
            latlong2: ^0.9.0
            flutter_math_fork: ^0.7.4
            encrypt: ^5.0.3
            crypto: ^3.0.6
            record: ^5.0.5
            audioplayers: ^6.1.0
            flutter_tts: ^4.2
            network_info_plus: ^6.1.3
            connectivity_plus: ^6.0.5
            http: ^1.3.0
            local_auth: ^2.2.0
            open_filex: ^4.3.4
            archive: ^3.6.1
            light: ^2.0.0
            environment_sensors: ^2.0.3
            pedometer: ^4.0.2
            camera: ^0.10.5+9
            flutter_local_notifications: ^18.0.1
            table_calendar: ^3.1.2
            mqtt_client: ^10.2.1
            home_widget: ^0.8.0
            permission_handler: ^11.3.1
            workmanager: ^0.5.2
          dev_dependencies:
            flutter_test: {sdk: flutter}
            flutter_lints: ^4.0.0
          flutter:
            uses-material-design: true
          YAML

          python3 << 'PY'
          import pathlib, re, textwrap
          p=pathlib.Path("android/app/build.gradle.kts")
          t=p.read_text()
          t=re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion','minSdk = 23',t)
          t=re.sub(r'minSdk\s*=\s*\d+','minSdk = 23',t)
          t=re.sub(r'\s*ndkVersion\s*=\s*".*?"\n','\n',t)
          if 'ndkVersion' not in t: t=t.replace('android {', 'android {\n    ndkVersion = flutter.ndkVersion')
          if 'isMinifyEnabled' not in t:
              t=t.replace('buildTypes {', 'buildTypes {\n        release {\n            isMinifyEnabled = true\n            isShrinkResources = true\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")\n        }')
          else:
              t=re.sub(r'isMinifyEnabled\s*=\s*false','isMinifyEnabled = true',t)
              t=re.sub(r'isShrinkResources\s*=\s*false','isShrinkResources = true',t)
          if 'proguard-rules.pro' not in t:
              t=t.replace('isShrinkResources = true', 'isShrinkResources = true\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',1)
          p.write_text(t)
          pathlib.Path("android/app/proguard-rules.pro").write_text('''-keep class com.wanalab.toolkit.** { *; }
          -keep class io.flutter.** { *; }
          -keep class io.flutter.embedding.** { *; }
          -keep class io.flutter.plugins.** { *; }
          -keep class com.google.** { *; }
          -keep class com.google.android.gms.** { *; }
          -keep class com.google.mlkit.** { *; }
          -keep class com.baseflow.permissionhandler.** { *; }
          -keep class com.baseflow.geolocator.** { *; }
          -keep class com.boskokg.flutter_blue_plus.** { *; }
          -keep class android.nfc.** { *; }
          -keep class android.hardware.** { *; }
          -keep class dev.fluttercommunity.plus.** { *; }
          -keep class com.dexterous.flutterlocalnotifications.** { *; }
          -keep class es.antonborri.home_widget.** { *; }
          -keep class androidx.work.** { *; }
          -keepclassmembers class * { @android.webkit.JavascriptInterface <methods>; }
          -keepattributes JavascriptInterface, *Annotation*, Signature, InnerClasses, EnclosingMethod
          -keepclasseswithmembernames class * { native <methods>; }
          -keepclassmembers enum * { public static **[] values(); public static ** valueOf(java.lang.String); }
          -keep class * implements android.os.Parcelable { *; }
          -dontwarn io.flutter.** -dontwarn com.google.** -dontwarn android.** -dontwarn androidx.** -dontwarn kotlin.** -dontwarn org.**
          ''')
          xml_dir=pathlib.Path("android/app/src/main/res/xml")
          xml_dir.mkdir(parents=True, exist_ok=True)
          (xml_dir/"home_widget_info.xml").write_text('<?xml version="1.0" encoding="utf-8"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="110dp" android:minHeight="110dp" android:updatePeriodMillis="30000" android:initialLayout="@layout/home_widget_layout" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen" android:previewImage="@mipmap/launcher_icon" />')
          layout_dir=pathlib.Path("android/app/src/main/res/layout")
          layout_dir.mkdir(parents=True, exist_ok=True)
          (layout_dir/"home_widget_layout.xml").write_text('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#2563EB" android:padding="12dp"><TextView android:id="@+id/widget_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="WanaLab" android:textColor="#FFFFFF" android:textSize="14sp" android:textStyle="bold"/><TextView android:id="@+id/widget_data" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="GPS + EMI + Weather" android:textColor="#FFFFFF" android:textSize="12sp"/><TextView android:id="@+id/widget_time" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="2026" android:textColor="#CCFFFFFF" android:textSize="10sp"/></LinearLayout>')
          manifest=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          mt=manifest.read_text()
          perms=["android.permission.CAMERA","android.permission.FLASHLIGHT","android.permission.NFC","android.permission.BLUETOOTH","android.permission.BLUETOOTH_ADMIN","android.permission.BLUETOOTH_SCAN","android.permission.BLUETOOTH_CONNECT","android.permission.ACCESS_FINE_LOCATION","android.permission.ACCESS_COARSE_LOCATION","android.permission.INTERNET","android.permission.RECORD_AUDIO","android.permission.USE_BIOMETRIC","android.permission.ACTIVITY_RECOGNITION","android.permission.BODY_SENSORS","android.permission.POST_NOTIFICATIONS","android.permission.FOREGROUND_SERVICE","android.permission.FOREGROUND_SERVICE_DATA_SYNC","android.permission.WRITE_EXTERNAL_STORAGE","android.permission.READ_EXTERNAL_STORAGE","android.permission.MANAGE_EXTERNAL_STORAGE","android.permission.READ_MEDIA_IMAGES","android.permission.READ_MEDIA_VIDEO","android.permission.READ_MEDIA_AUDIO","android.permission.SCHEDULE_EXACT_ALARM","android.permission.USE_EXACT_ALARM","android.permission.RECEIVE_BOOT_COMPLETED","android.permission.WAKE_LOCK","android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"]
          for perm in perms:
              if perm not in mt: mt=mt.replace("<application", f'<uses-permission android:name="{perm}" />\n    <application')
          mt=re.sub(r'<receiver[^>]*home_widget[^>]*>.*?</receiver>\s*','',mt,flags=re.DOTALL|re.IGNORECASE)
          mt=re.sub(r'<receiver[^>]*BootReceiver[^>]*>.*?</receiver>\s*','',mt,flags=re.DOTALL|re.IGNORECASE)
          mt=re.sub(r'<service[^>]*HomeWidgetBackgroundService[^>]*>.*?</service>\s*','',mt,flags=re.DOTALL|re.IGNORECASE)
          receivers_xml='''    <receiver android:name="es.antonborri.home_widget.HomeWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/home_widget_info" /></receiver>
              <receiver android:name="com.wanalab.toolkit.BootReceiver" android:exported="true" android:enabled="true"><intent-filter android:priority="1000"><action android:name="android.intent.action.BOOT_COMPLETED" /><action android:name="android.intent.action.MY_PACKAGE_REPLACED" /></intent-filter></receiver>
              <service android:name="es.antonborri.home_widget.HomeWidgetBackgroundService" android:permission="android.permission.BIND_JOB_SERVICE" android:exported="false"/>
          '''
          if "HomeWidgetProvider" not in mt: mt=mt.replace("</application>", receivers_xml+"</application>")
          if '<uses-feature' not in mt.lower(): mt=mt.replace("<application", '<uses-feature android:name="android.hardware.camera.flash" android:required="false" />\n    <uses-feature android:name="android.hardware.sensor.stepcounter" android:required="false" />\n    <uses-feature android:name="android.hardware.sensor.stepdetector" android:required="false" />\n    <application')
          manifest.write_text(mt)
          kt_files=list(pathlib.Path("android/app/src/main").rglob("MainActivity*"))
          java_dir2=kt_files[0].parent if kt_files else pathlib.Path("android/app/src/main/kotlin/com/wanalab/toolkit")
          java_dir2.mkdir(parents=True, exist_ok=True)
          (java_dir2/"BootReceiver.kt").write_text('package com.wanalab.toolkit\nimport android.content.BroadcastReceiver\nimport android.content.Context\nimport android.content.Intent\nimport android.util.Log\nclass BootReceiver : BroadcastReceiver() { override fun onReceive(context: Context, intent: Intent) { try { Log.d("WanaLabBoot", "Boot ${intent.action}") } catch(e: Exception) { Log.e("WanaLabBoot", "Error ${e.message}") } } }')

          def w(path, c): pathlib.Path(path).parent.mkdir(parents=True, exist_ok=True); pathlib.Path(path).write_text(textwrap.dedent(c).strip()+"\n")
