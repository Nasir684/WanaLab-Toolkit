name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Manual clone - skip long files
        run: |
          git clone --no-checkout --depth 1 https://github.com/Nasir684/WanaLab-Toolkit.git tmp
          cd tmp
          git config core.longpaths true
          git config core.protectNTFS false
          git sparse-checkout init --no-cone
          git sparse-checkout set lib android pubspec.yaml
          git checkout main
          cd ..
          mv tmp/lib ./lib
          mv tmp/android ./android
          mv tmp/pubspec.yaml ./pubspec.yaml
          mv tmp/.git ./.git
          rm -rf tmp
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-APK
          path: build/app/outputs/flutter-apk/app-release.apk
