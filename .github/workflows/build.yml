          cat > lib/features/camera/ocr_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:google_mlkit_text_recognition/google_mlkit_text_recognition.dart';
          import 'package:share_plus/share_plus.dart';
          class OCRScreen extends StatefulWidget { const OCRScreen({super.key}); @override State<OCRScreen> createState()=> _OCRState(); }
          class _OCRState extends State<OCRScreen> { String text='No text yet OCR ML Kit Local-only'; bool loading=false; final picker=ImagePicker(); Future<void> scan(ImageSource src) async { final file=await picker.pickImage(source: src); if(file==null) return; setState(()=> loading=true); try{ final input=InputImage.fromFilePath(file.path); final rec=TextRecognizer(script: TextRecognitionScript.latin); final r=await rec.processImage(input); setState(()=> text=r.text.isEmpty?'No text':r.text); await rec.close(); }catch(e){ setState(()=> text='Error $e'); } setState(()=> loading=false);} @override Widget build(BuildContext context){ return ListView(padding: const EdgeInsets.all(16), children:[ const Text('OCR ML Kit Local-only NOT Tesseract', style: TextStyle(fontWeight: FontWeight.bold), textAlign: TextAlign.center), Row(children:[ Expanded(child: FilledButton.icon(onPressed: ()=> scan(ImageSource.camera), icon: const Icon(Icons.camera_alt), label: const Text('Camera'))), const SizedBox(width:8), Expanded(child: FilledButton.tonalIcon(onPressed: ()=> scan(ImageSource.gallery), icon: const Icon(Icons.photo), label: const Text('Gallery')))]), if(loading) const CircularProgressIndicator() else Card(child: Padding(padding: const EdgeInsets.all(12), child: SelectableText(text))), OutlinedButton.icon(onPressed: ()=> Share.share(text), icon: const Icon(Icons.share), label: const Text('Share')) ]); } }
