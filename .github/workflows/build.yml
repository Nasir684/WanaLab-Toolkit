name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.29.3', channel: 'stable'}

      - name: Build WanaLab v3.0 RESEARCH PLATFORM 2037
        run: |
          rm -rf android lib test pubspec.yaml pubspec.lock
          flutter create --project-name wana_lab_toolkit --org com.wanalab.toolkit --platforms=android .
          rm -rf test
          mkdir -p lib/services lib/features/sensors lib/features/camera lib/features/religion lib/features/language lib/features/phd lib/features/dev lib/features/detector assets
          pip install Pillow -q
          python3 -c "from PIL import Image, ImageDraw; img=Image.new('RGB',(1024,1024),(37,99,235)); d=ImageDraw.Draw(img); d.ellipse([180,180,844,844], fill='white'); img.save('assets/icon.png')"

          cat > pubspec.yaml << 'YAML'
          name: wana_lab_toolkit
          description: Research-oriented mobile platform for engineering estimation, EMI screening, detector analysis & scientific workflow support (evolution through 2037). Local-only, privacy-first, no login, no cloud. By Nasir Khan - https://github.com/Nasir684/WanaLab-Toolkit
          publish_to: 'none'
          version: 3.0.0+1
          environment: {sdk: '>=3.2.0 <4.0.0'}
          dependencies:
            flutter: {sdk: flutter}
            shared_preferences: ^2.3.3
            geolocator: ^13.0.2
            intl: ^0.20.2
            pdf: ^3.11.1
            printing: ^5.12.0
            share_plus: ^10.0.4
            path_provider: ^2.1.4
            file_picker: ^8.1.6
            sensors_plus: ^6.1.1
            light: ^2.0.0
            battery_plus: ^6.1.0
            mobile_scanner: ^5.2.3
            qr_flutter: ^4.1.0
            image_picker: ^1.1.2
            google_mlkit_text_recognition: ^0.13.1
            adhan: ^2.0.0
            hijri: ^3.0.0
            url_launcher: ^6.2.5
          dev_dependencies: {flutter_test: {sdk: flutter}, flutter_lints: ^4.0.0}
          flutter: {uses-material-design: true, assets: [assets/icon.png]}
          YAML

          cat > lib/services/storage_service.dart << 'DART'
          import 'package:shared_preferences/shared_preferences.dart';
          class StorageService {
            static SharedPreferences? _p;
            static Future<void> init() async { _p = await SharedPreferences.getInstance(); }
            static Future<List<String>> getList(String k) async => _p?.getStringList(k) ?? [];
            static Future<void> setList(String k, List<String> v) async => await _p?.setStringList(k, v);
            static Future<int> getInt(String k) async => _p?.getInt(k) ?? 0;
            static Future<void> setInt(String k, int v) async => await _p?.setInt(k, v);
            static Future<void> clearAll() async => await _p?.clear();
          }
          DART

          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart'; import 'services/storage_service.dart'; import 'app.dart';
          void main() async { WidgetsFlutterBinding.ensureInitialized(); await StorageService.init(); runApp(const WanaLabApp()); }
          DART

          cat > lib/app.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'features/dashboard_screen.dart'; import 'features/core_screen.dart'; import 'features/gps_screen.dart'; import 'features/import_export_screen.dart'; import 'features/settings_screen.dart'; import 'features/about_screen.dart';
          import 'features/sensors/compass_screen.dart'; import 'features/camera/barcode_screen.dart';
          import 'features/religion/qibla_screen.dart'; import 'features/religion/prayer_screen.dart';
          import 'features/language/translator_screen.dart'; import 'features/phd/citation_screen.dart'; import 'features/phd/statistics_screen.dart'; import 'features/phd/notes_screen.dart';
          import 'features/dev/developer_screen.dart'; import 'features/dev/pricing_screen.dart'; import 'features/dev/demo_screen.dart'; import 'features/dev/changelog_screen.dart'; import 'features/dev/roadmap_screen.dart';
          import 'features/detector/emi_screen.dart'; import 'features/detector/detector_screen.dart';
          class WanaLabApp extends StatelessWidget { const WanaLabApp({super.key}); @override Widget build(BuildContext context){ return MaterialApp(title:'WanaLab v3.0 Research Platform', debugShowCheckedModeBanner:false, theme:ThemeData(useMaterial3:true, colorSchemeSeed:Color(0xFF2563EB)), home:const MainScaffold()); } }
          class MainScaffold extends StatefulWidget { const MainScaffold({super.key}); @override State<MainScaffold> createState()=>_M(); }
          class _M extends State<MainScaffold>{
            int idx=0; void go(int i)=>setState(()=>idx=i);
            final titles=["Dashboard","Core Estimation","GPS Pro","Export/Import","Settings","About README","Compass","Barcode","Qibla","Prayer Times","Translator","Citation","Statistics","Research Notes","Developer - Nasir Khan","Pricing","Demo Tutorial","Changelog","Roadmap 2037","EMI Screening","Detector Analysis"];
            late final screens;
            @override void initState(){ super.initState(); screens=[DashboardScreen(onNav: go), const CoreScreen(), const GPSScreen(), const ImportExportScreen(), const SettingsScreen(), const AboutScreen(), const CompassScreen(), const BarcodeScreen(), const QiblaScreen(), const PrayerScreen(), const TranslatorScreen(), const CitationScreen(), const StatisticsScreen(), const NotesScreen(), const DeveloperScreen(), const PricingScreen(), const DemoScreen(), const ChangelogScreen(), const RoadmapScreen(), const EMIScreen(), const DetectorScreen()]; }
            @override Widget build(BuildContext c){
              return Scaffold(appBar:AppBar(title:Text(titles[idx]), centerTitle:true), body: idx==0 ? DashboardScreen(onNav: go) : screens[idx], drawer: Drawer(child: ListView(padding:EdgeInsets.zero, children:[
                const DrawerHeader(decoration:BoxDecoration(color:Color(0xFF2563EB)), child:Column(crossAxisAlignment:CrossAxisAlignment.start, mainAxisAlignment:MainAxisAlignment.end, children:[Icon(Icons.science, size:32, color:Colors.white), SizedBox(height:6), Text('WanaLab v3.0', style:TextStyle(color:Colors.white,fontSize:18,fontWeight:FontWeight.bold)), Text('Research Platform 2037\nLocal-only, Privacy-first', style:TextStyle(color:Colors.white70,fontSize:10))])),
                ListTile(dense:true, leading:const Icon(Icons.person, size:18, color:Colors.blue), title:Text(titles[14], style:const TextStyle(fontSize:11)), selected:idx==14, onTap:(){setState(()=>idx=14); Navigator.pop(c);}),
                ListTile(dense:true, leading:const Icon(Icons.payments, size:18, color:Colors.green), title:Text(titles[15], style:const TextStyle(fontSize:11)), selected:idx==15, onTap:(){setState(()=>idx=15); Navigator.pop(c);}),
                ListTile(dense:true, leading:const Icon(Icons.map, size:18, color:Colors.orange), title:Text(titles[18], style:const TextStyle(fontSize:11)), selected:idx==18, onTap:(){setState(()=>idx=18); Navigator.pop(c);}),
                const Divider(),
                const Padding(padding:EdgeInsets.fromLTRB(16,4,0,2), child:Text('RESEARCH PLATFORM', style:TextStyle(fontSize:9,fontWeight:FontWeight.bold,color:Colors.grey))),
                ListTile(dense:true, title:Text(titles[1], style:const TextStyle(fontSize:11)), onTap:(){setState(()=>idx=1); Navigator.pop(c);}),
                ListTile(dense:true, title:Text(titles[19], style:const TextStyle(fontSize:11)), onTap:(){setState(()=>idx=19); Navigator.pop(c);}),
                ListTile(dense:true, title:Text(titles[20], style:const TextStyle(fontSize:11)), onTap:(){setState(()=>idx=20); Navigator.pop(c);}),
                ListTile(dense:true, title:Text(titles[8], style:const TextStyle(fontSize:11)), onTap:(){setState(()=>idx=8); Navigator.pop(c);}),
                ListTile(dense:true, title:Text(titles[13], style:const TextStyle(fontSize:11)), onTap:(){setState()=>idx=13; Navigator.pop(c);}),
                ListTile(dense:true, title:Text(titles[5], style:const TextStyle(fontSize:11)), onTap:(){setState()=>idx=5; Navigator.pop(c);}),
              ])), bottomNavigationBar: NavigationBar(selectedIndex: idx>4?0:idx, onDestinationSelected:(v){ if(v==0) setState(()=>idx=0); if(v==1) setState(()=>idx=14); if(v==2) setState(()=>idx=18); if(v==3) setState()=>idx=19; if(v==4) setState(()=>idx=5); }, destinations:const [NavigationDestination(icon:Icon(Icons.dashboard), label:'Platform'), NavigationDestination(icon:Icon(Icons.person), label:'Author'), NavigationDestination(icon:Icon(Icons.map), label:'Roadmap'), NavigationDestination(icon:Icon(Icons.science), label:'EMI/Detect'), NavigationDestination(icon:Icon(Icons.info), label:'README')])); }
          }
          DART

          cat > lib/features/dashboard_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart';
          class DashboardScreen extends StatefulWidget { final Function(int) onNav; const DashboardScreen({super.key, required this.onNav}); @override State<DashboardScreen> createState()=>_D(); }
          class _D extends State<DashboardScreen>{
            int cores=0; @override void initState(){super.initState(); _load();} Future<void> _load() async { final c=await StorageService.getList('cores'); if(mounted) setState(()=>cores=c.length); }
            @override Widget build(BuildContext context){
              return ListView(padding:const EdgeInsets.all(8), children:[
                Card(color:const Color(0xFF2563EB), child:Padding(padding:const EdgeInsets.all(12), child:Column(crossAxisAlignment:CrossAxisAlignment.start, children:[Row(children:[const Icon(Icons.science, color:Colors.white, size:32), const SizedBox(width:10), const Expanded(child:Column(crossAxisAlignment:CrossAxisAlignment.start, children:[Text('WanaLab v3.0', style:TextStyle(color:Colors.white,fontSize:15,fontWeight:FontWeight.bold)), Text('Research Platform 2037', style:TextStyle(color:Colors.white70,fontSize:11))])), Text('$cores', style:const TextStyle(color:Colors.white,fontSize:16,fontWeight:FontWeight.bold))]), const SizedBox(height:8), const Text('Research-oriented mobile platform for engineering estimation, EMI screening, detector analysis & scientific workflow support (evolution through 2037). Local-only, privacy-first, no login, no cloud.', style:TextStyle(color:Colors.white, fontSize:10), textAlign:TextAlign.left)]))),
                _cat('RESEARCH PLATFORM CORE (4) - Engineering, EMI, Detector, Workflow'), GridView.count(crossAxisCount:2, shrinkWrap:true, physics:const NeverScrollableScrollPhysics(), mainAxisSpacing:6, crossAxisSpacing:6, childAspectRatio:1.6, children:[_b('Engineering\nEstimation',Icons.terrain,Colors.green,1), _b('EMI\nScreening',Icons.electrical_services,Colors.orange,19), _b('Detector\nAnalysis',Icons.sensors,Colors.purple,20), _b('Scientific\nWorkflow',Icons.note,Colors.blue,13)]),
                _cat('PLATFORM PRINCIPLES'), Card(color:Colors.green.shade50, child:Padding(padding:const EdgeInsets.all(10), child:Column(children:[_p('Local-only','All data stays on device, no cloud'), _p('Privacy-first','No tracking, no ads SDK, no login'), _p('No Login','Open app and research'), _p('No Cloud','Works 100% offline in Wana'), _p('Evolution 2037','Roadmap to 2037 - See Roadmap screen')]))),
                _cat('DEVELOPER & BUSINESS'), GridView.count(crossAxisCount:4, shrinkWrap:true, physics:const NeverScrollableScrollPhysics(), mainAxisSpacing:4, crossAxisSpacing:4, childAspectRatio:0.9, children:[_b('Author\nNasir Khan',Icons.person,Colors.blue,14), _b('Pricing\nPlans',Icons.payments,Colors.green,15), _b('Roadmap\n2037',Icons.map,Colors.orange,18), _b('README\nAbout',Icons.info,Colors.purple,5)]),
                _cat('FULL TOOLKIT (56 Tools)'), GridView.count(crossAxisCount:4, shrinkWrap:true, physics:const NeverScrollableScrollPhysics(), mainAxisSpacing:4, crossAxisSpacing:4, childAspectRatio:0.9, children:[_b('GPS Pro\nField',Icons.gps_fixed,Colors.blue,2), _b('Qibla\nReligion',Icons.mosque,Colors.green,8), _b('Trans\nLanguage',Icons.translate,Colors.orange,10), _b('Barcode\nCamera',Icons.qr_code_scanner,Colors.teal,7), _b('Stats\nResearch',Icons.bar_chart,Colors.purple,12), _b('Export\nFile Share',Icons.import_export,Colors.indigo,3), _b('Demo\nTutorial',Icons.play_circle,Colors.orange,16), _b('Changelog\nHistory',Icons.history,Colors.grey,17)]),
              ]);
            }
            Widget _cat(String t){ return Padding(padding:const EdgeInsets.fromLTRB(4,10,0,4), child:Text(t, style:const TextStyle(fontSize:10,fontWeight:FontWeight.bold,color:Colors.grey))); }
            Widget _p(String k,String v){ return Padding(padding:const EdgeInsets.symmetric(vertical:2), child:Row(children:[Text('$k: ', style:const TextStyle(fontWeight:FontWeight.bold, fontSize:11)), Expanded(child:Text(v, style:const TextStyle(fontSize:11)))])); }
            Widget _b(String t,IconData ic,Color col,int idx){ return InkWell(onTap:()=>widget.onNav(idx), borderRadius:BorderRadius.circular(8), child:Card(elevation:2, child:Padding(padding:const EdgeInsets.all(4), child:Column(mainAxisAlignment:MainAxisAlignment.center, children:[Icon(ic,color:col,size:22), const SizedBox(height:3), Text(t, textAlign:TextAlign.center, style:const TextStyle(fontSize:8,fontWeight:FontWeight.bold))])))); }
          }
          DART

          cat > lib/features/core_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart'; import 'package:intl/intl.dart'; import 'package:share_plus/share_plus.dart'; class CoreScreen extends StatefulWidget { const CoreScreen({super.key}); @override State<CoreScreen> createState()=>_C(); } class _C extends State<CoreScreen>{final wt=TextEditingController(), wc=TextEditingController(text:'100'), vc=TextEditingController(text:'1000'), water=TextEditingController(), loc=TextEditingController(); double bulk=0,dry=0; List<String> hist=[]; @override void initState(){super.initState(); _load();} Future<void> _load() async { hist=await StorageService.getList('cores'); if(mounted) setState((){}); } void calc(){ double wT=double.tryParse(wt.text)??0; double wC=double.tryParse(wc.text)??0; double vC=double.tryParse(vc.text)??1000; double w=double.tryParse(water.text)??0; if(wT==0||vC==0){ return; } bulk=(wT-wC)/vC; dry=bulk/(1+w/100); setState((){}); } Future<void> save() async { hist.add('${DateFormat('dd-MM HH:mm').format(DateTime.now())} | ${loc.text} | B:${bulk.toStringAsFixed(3)}'); await StorageService.setList('cores', hist); if(mounted) setState((){}); } @override Widget build(BuildContext c){ return ListView(padding:const EdgeInsets.all(10), children:[const Text('Engineering Estimation - Core Cutter Bulk/Dry - Local-only, no cloud', style:TextStyle(fontSize:10, fontWeight:FontWeight.bold)), TextField(controller:loc, decoration:const InputDecoration(labelText:'Location', border:OutlineInputBorder())), TextField(controller:wt, decoration:const InputDecoration(labelText:'Wt core+soil', border:OutlineInputBorder())), Row(children:[Expanded(child:TextField(controller:wc, decoration:const InputDecoration(labelText:'Wt core', border:OutlineInputBorder()))), const SizedBox(width:6), Expanded(child:TextField(controller:vc, decoration:const InputDecoration(labelText:'Vol cc', border:OutlineInputBorder())))]), TextField(controller:water, decoration:const InputDecoration(labelText:'Water %', border:OutlineInputBorder())), FilledButton(onPressed:calc, child:const Text('Calculate - Local')), Text('Bulk:${bulk.toStringAsFixed(3)} Dry:${dry.toStringAsFixed(3)} - Privacy-first, stays on device'), Row(children:[Expanded(child:FilledButton.tonal(onPressed:save, child:const Text('Save Local'))), const SizedBox(width:6), Expanded(child:OutlinedButton(onPressed:()=>Share.share('Bulk:${bulk.toStringAsFixed(3)} - Local-only'), child:const Text('Share')))]), ...hist.map((e)=>Text(e, style:const TextStyle(fontSize:10)))]); } }
          DART

          cat > lib/features/gps_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import 'package:geolocator/geolocator.dart'; import '../services/storage_service.dart'; import 'package:share_plus/share_plus.dart'; import 'package:path_provider/path_provider.dart'; import 'dart:io';
          class GPSScreen extends StatefulWidget { const GPSScreen({super.key}); @override State<GPSScreen> createState()=>_G(); }
          class _G extends State<GPSScreen>{String loc='Press Get GPS - Local-only'; List<String> pts=[]; Position? last; @override void initState(){super.initState(); _load();} Future<void> _load() async { pts=await StorageService.getList('gps'); if(mounted) setState((){}); } Future<void> getLoc() async { last=await Geolocator.getCurrentPosition(desiredAccuracy:LocationAccuracy.high); if(!mounted) return; setState(()=>loc='Lat: ${last!.latitude}\nLong: ${last!.longitude}\nAlt: ${last!.altitude.toStringAsFixed(1)}m\nLocal-only, no cloud'); } Future<void> saveP() async { pts.add('${DateTime.now().toString().substring(0,19)} | ${last!.latitude.toStringAsFixed(6)},${last!.longitude.toStringAsFixed(6)}'); await StorageService.setList('gps', pts); if(mounted) setState((){}); } Future<void> shareLoc() async { if(last==null){ return; } await Share.share('Lat:${last!.latitude} Long:${last!.longitude}\nhttps://maps.google.com/?q=${last!.latitude},${last!.longitude} - Local-only'); } Future<void> exportFile() async { final dir=await getTemporaryDirectory(); final file=File('${dir.path}/GPS.txt'); await file.writeAsString(pts.join('\n')); await Share.shareXFiles([XFile(file.path)]); } @override Widget build(BuildContext c){ return ListView(padding:const EdgeInsets.all(12), children:[Card(child:Padding(padding:const EdgeInsets.all(12), child:SelectableText(loc))), Row(children:[Expanded(child: FilledButton.icon(onPressed:getLoc, icon:const Icon(Icons.my_location), label:const Text('Get GPS Pro Local'))), const SizedBox(width:6), Expanded(child: FilledButton.tonal(onPressed:saveP, child:const Text('Save Local')))]), Row(children:[Expanded(child: OutlinedButton.icon(onPressed:shareLoc, icon:const Icon(Icons.share), label:const Text('Share'))), const SizedBox(width:6), Expanded(child: OutlinedButton.icon(onPressed:exportFile, icon:const Icon(Icons.file_present), label:const Text('Export File')))]), Text('Saved: ${pts.length} - Local-only, no cloud'), ...pts.reversed.map((e)=>Text(e, style:const TextStyle(fontSize:10)))]); } }
          DART

          cat > lib/features/sensors/compass_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import 'package:sensors_plus/sensors_plus.dart'; import 'dart:math'; class CompassScreen extends StatefulWidget { const CompassScreen({super.key}); @override State<CompassScreen> createState()=>_C(); } class _C extends State<CompassScreen>{double h=0; @override void initState(){super.initState(); magnetometerEventStream().listen((e){ double hh=atan2(e.y, e.x)*180/pi; if(hh<0) hh+=360; if(mounted) setState(()=>h=hh); }); } @override Widget build(BuildContext c){ return ListView(padding:const EdgeInsets.all(20), children:[const Text('Compass - Detector Analysis - Local', textAlign:TextAlign.center, style:TextStyle(fontWeight:FontWeight.bold)), Center(child:Transform.rotate(angle:-h*pi/180, child:const Icon(Icons.navigation,size:120,color:Colors.red))), Center(child:Text('${h.toStringAsFixed(0)}° Local-only', style:const TextStyle(fontSize:32,fontWeight:FontWeight.bold)))]); } }
          DART
          cat > lib/features/camera/barcode_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import 'package:mobile_scanner/mobile_scanner.dart'; import 'package:share_plus/share_plus.dart'; class BarcodeScreen extends StatefulWidget { const BarcodeScreen({super.key}); @override State<BarcodeScreen> createState()=>_B(); } class _B extends State<BarcodeScreen>{String res='Scan barcode/QR - Local-only'; MobileScannerController ctrl=MobileScannerController(); @override Widget build(BuildContext c){ return Column(children:[Expanded(flex:3, child:MobileScanner(controller:ctrl, onDetect:(cap){ final b=cap.barcodes.first.rawValue; if(b!=null){ setState(()=>res=b); ctrl.stop(); } })), Expanded(flex:2, child:Padding(padding:const EdgeInsets.all(12), child:Column(children:[const Text('BARCODE/QR SCANNER - Local', style:TextStyle(fontWeight:FontWeight.bold)), Card(child:Padding(padding:const EdgeInsets.all(10), child:SelectableText(res))), Row(children:[Expanded(child: FilledButton(onPressed:(){ setState(()=>res='Scan...'); ctrl.start(); }, child:const Text('Scan Again'))), const SizedBox(width:6), Expanded(child: OutlinedButton.icon(onPressed:()=>Share.share(res), icon:const Icon(Icons.share), label:const Text('Share')))])])))]); } }
          DART
          cat > lib/features/religion/qibla_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import 'package:geolocator/geolocator.dart'; import 'dart:math'; class QiblaScreen extends StatefulWidget { const QiblaScreen({super.key}); @override State<QiblaScreen> createState()=>_Q(); } class _Q extends State<QiblaScreen>{double q=0; String loc='Getting location... Local-only'; @override void initState(){super.initState(); _get();} Future<void> _get() async { try{ final pos=await Geolocator.getCurrentPosition(); const kaabaLat=21.4225; const kaabaLong=39.8262; double lat1=pos.latitude*pi/180; double long1=pos.longitude*pi/180; double lat2=kaabaLat*pi/180; double long2=kaabaLong*pi/180; double dLong=long2-long1; double y=sin(dLong)*cos(lat2); double x=cos(lat1)*sin(lat2)-sin(lat1)*cos(lat2)*cos(dLong); double qq=atan2(y,x)*180/pi; qq=(qq+360)%360; if(mounted) setState((){ q=qq; loc='Lat:${pos.latitude.toStringAsFixed(4)} Long:${pos.longitude.toStringAsFixed(4)}\nQibla: ${q.toStringAsFixed(1)}° Local-only'; }); } catch(e){ if(mounted) setState(()=>loc='Enable GPS - Local-only'); } } @override Widget build(BuildContext c){ return ListView(padding:const EdgeInsets.all(16), children:[const Text('QIBLA COMPASS - Local-only', textAlign:TextAlign.center, style:TextStyle(fontWeight:FontWeight.bold)), Card(child:Padding(padding:const EdgeInsets.all(12), child:Text(loc, textAlign:TextAlign.center))), Center(child:Icon(Icons.navigation, size:120, color:Colors.green)), Center(child:Text('${q.toStringAsFixed(1)}° from North - Privacy-first', style:const TextStyle(fontSize:16,fontWeight:FontWeight.bold)))]); } }
          DART
          cat > lib/features/religion/prayer_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import 'package:adhan/adhan.dart'; import 'package:intl/intl.dart'; import 'package:geolocator/geolocator.dart'; class PrayerScreen extends StatefulWidget { const PrayerScreen({super.key}); @override State<PrayerScreen> createState()=>_P(); } class _P extends State<PrayerScreen>{String t='Press Get Prayer Times - Local-only'; Future<void> getTimes() async { try{ final pos=await Geolocator.getCurrentPosition(); final coords=Coordinates(pos.latitude, pos.longitude); final params=CalculationMethod.karachi.getParameters(); params.madhab=Madhab.hanafi; final p=PrayerTimes(coords, DateComponents.from(DateTime.now()), params); if(mounted) setState(()=>t='Fajr: ${DateFormat('hh:mm a').format(p.fajr)}\nDhuhr: ${DateFormat('hh:mm a').format(p.dhuhr)}\nAsr: ${DateFormat('hh:mm a').format(p.asr)}\nMaghrib: ${DateFormat('hh:mm a').format(p.maghrib)}\nIsha: ${DateFormat('hh:mm a').format(p.isha)}\nLocal-only calculation'); } catch(e){ if(mounted) setState(()=>t='Error $e'); } } @override Widget build(BuildContext c){ return ListView(padding:const EdgeInsets.all(16), children:[const Text('PRAYER TIMES - Local-only, no cloud', textAlign:TextAlign.center, style:TextStyle(fontWeight:FontWeight.bold)), FilledButton(onPressed:getTimes, child:const Text('Get Times GPS Local')), Card(child:Padding(padding:const EdgeInsets.all(16), child:Text(t, style:const TextStyle(fontSize:16))))]); } }
          DART
          cat > lib/features/language/translator_screen.dart << 'DART'
          import 'package:flutter/material.dart'; class TranslatorScreen extends StatelessWidget { const TranslatorScreen({super.key}); @override Widget build(BuildContext c){ return ListView(padding:const EdgeInsets.all(12), children:const [Text('TRANSLATOR - Local-only Offline', textAlign:TextAlign.center, style:TextStyle(fontWeight:FontWeight.bold)), Card(child:Padding(padding:EdgeInsets.all(12), child:Text('water: پانی / اوبه / ماء\nsoil: مٹی / خاوره / تربة\nlab: لیبارٹری / لابراتوار / مختبر\nPrivacy-first, no cloud')))]); } }
          DART
          cat > lib/features/phd/citation_screen.dart << 'DART'
          import 'package:flutter/material.dart'; class CitationScreen extends StatelessWidget { const CitationScreen({super.key}); @override Widget build(BuildContext c){ return ListView(padding:const EdgeInsets.all(12), children:const [Text('CITATION APA/MLA - Scientific Workflow - Local-only', textAlign:TextAlign.center, style:TextStyle(fontWeight:FontWeight.bold)), Card(child:Padding(padding:EdgeInsets.all(12), child:Text('APA: Author (Year). Title. Journal.\nMLA: Author. "Title." Journal, Year.\nLocal-only, no cloud')))]); } }
