          import 'package:flutter/material.dart'; import 'package:shared_preferences/shared_preferences.dart'; import 'dart:convert';
          class LanguageLearnScreen extends StatefulWidget { const LanguageLearnScreen({super.key}); @override State<LanguageLearnScreen> createState()=> _LearnS(); }
          class _LearnS extends State<LanguageLearnScreen> {
            List<Map<String,String>> words=[]; int idx=0; bool show=false; int score=0; List<String> learned=[];
            @override void initState(){ super.initState(); loadWords(); loadProgress(); }
            void loadWords(){
              words=[
                {'en':'water','ps':'اوبه','ur':'پانی'}, {'en':'mountain','ps':'غر','ur':'پہاڑ'}, {'en':'lab','ps':'لابراتوار','ur':'لیبارٹری'}, {'en':'research','ps':'څیړنه','ur':'تحقیق'}, {'en':'peace','ps':'سوله','ur':'امن'}, {'en':'book','ps':'کتاب','ur':'کتاب'}, {'en':'school','ps':'ښوونځی','ur':'سکول'}, {'en':'teacher','ps':'ښوونکی','ur':'استاد'}, {'en':'student','ps':'زده کوونکی','ur':'طالب علم'}, {'en':'health','ps':'روغتیا','ur':'صحت'},
                {'en':'sun','ps':'لمر','ur':'سورج'}, {'en':'moon','ps':'سپوږمۍ','ur':'چاند'}, {'en':'rain','ps':'باران','ur':'بارش'}, {'en':'road','ps':'سړک','ur':'سڑک'}, {'en':'house','ps':'کور','ur':'گھر'}, {'en':'good','ps':'ښه','ur':'اچھا'}, {'en':'big','ps':'لوی','ur':'بڑا'}, {'en':'today','ps':'نن','ur':'آج'}, {'en':'thank you','ps':'مننه','ur':'شکریہ'}, {'en':'hello','ps':'سلام','ur':'سلام'},
              ];
            }
            Future<void> loadProgress() async { final p=await SharedPreferences.getInstance(); score=p.getInt('lang_score')??0; List<String>? l=p.getStringList('lang_learned'); if(l!=null) learned=l; }
            Future<void> saveProgress() async { final p=await SharedPreferences.getInstance(); await p.setInt('lang_score', score); await p.setStringList('lang_learned', learned); }
            void next(bool known){
              if(known){ score++; if(!learned.contains(words[idx]['en']!)) learned.add(words[idx]['en']!); }
              setState((){ idx=(idx+1)%words.length; show=false; });
              saveProgress();
            }
            @override Widget build(BuildContext c){
              if(words.isEmpty) return Center(child: Text('Loading'));
              var w=words[idx];
              return ListView(padding: EdgeInsets.all(12), children: [
                Card(child: Padding(padding: EdgeInsets.all(16), child: Column(children: [
                  Text('Language Learning - Flashcards', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                  Text('Score $score - Learned ${learned.length}/${words.length}', style: TextStyle(color: Colors.grey)),
                  LinearProgressIndicator(value: learned.length/words.length),
                  SizedBox(height: 20),
                  Text('EN: ${w['en']}', style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold)),
                  SizedBox(height: 20),
                  if(show) Column(children: [Text('PS: ${w['ps']}', style: TextStyle(fontSize: 22, color: Colors.green)), Text('UR: ${w['ur']}', style: TextStyle(fontSize: 22, color: Colors.blue))]) else Text('Tap Show to reveal Pashto/Urdu', style: TextStyle(color: Colors.grey)),
                  SizedBox(height: 20),
                  Row(children: [Expanded(child: FilledButton.tonalIcon(onPressed: (){ setState(()=> show=!show); }, icon: Icon(show?Icons.visibility_off:Icons.visibility), label: Text(show?'Hide':'Show')))]),
                  SizedBox(height: 12),
                  Row(children: [Expanded(child: FilledButton.icon(onPressed: ()=> next(false), icon: Icon(Icons.close, color: Colors.red), label: Text('Don\\'t know'))), SizedBox(width: 8), Expanded(child: FilledButton.icon(onPressed: ()=> next(true), icon: Icon(Icons.check, color: Colors.green), label: Text('Know')))]),
                  SizedBox(height: 8),
                  Text('${idx+1}/${words.length}', style: TextStyle(color: Colors.grey)),
                ]))),
                Card(child: Padding(padding: EdgeInsets.all(12), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text('Learned:', style: TextStyle(fontWeight: FontWeight.bold)), Wrap(spacing: 4, children: learned.map((e)=> Chip(label: Text(e, style: TextStyle(fontSize: 10)), backgroundColor: Colors.green.shade100)).toList())]))),
                Card(child: Padding(padding: EdgeInsets.all(12), child: Text('Lang Learn:\\n• 20 words En/Ps/Ur\\n• Flashcard know/don\\'t know\\n• Score + learned list\\n• SharedPreferences\\n• For Wana students\\nWanaLab v3.4.22'))),
              ]);
            }
          }
