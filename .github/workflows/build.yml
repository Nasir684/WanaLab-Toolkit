name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Safe download
        run: |
          python3 - << 'PY'
          import tarfile, urllib.request, os
          url = "https://github.com/Nasir684/WanaLab-Toolkit/archive/main.tar.gz"
          urllib.request.urlretrieve(url, "repo.tar.gz")
          with tarfile.open("repo.tar.gz", "r:gz") as tar:
              for m in tar.getmembers():
                  if "/" not in m.name: continue
                  inner = m.name.split("/",1)[1]
                  if not (inner.startswith("lib/") or inner.startswith("android/") or inner == "pubspec.yaml"): continue
                  if len(inner) > 120: continue
                  d = os.path.dirname(inner)
                  if d: os.makedirs(d, exist_ok=True)
                  if m.isfile():
                      f = tar.extractfile(m)
                      if f: open(inner, "wb").write(f.read())
          PY

      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          cat android/local.properties
          if ! grep -q "namespace" android/app/build.gradle; then
            sed -i "/^android {/a \    namespace 'com.example.wana_lab_toolkit'" android/app/build.gradle
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - run: flutter pub get

      - name: Patch geolocator_android 4.6.2 bug
        run: |
          GEO_FILE=$(find ~/.pub-cache -path "*geolocator_android-*/android/build.gradle" | head -1)
          echo "Found: $GEO_FILE"
          cat "$GEO_FILE" | head -60
          # Replace flutter.* properties with hardcoded values
          sed -i "s/flutter.compileSdkVersion/34/g" "$GEO_FILE"
          sed -i "s/flutter.minSdkVersion/21/g" "$GEO_FILE"
          sed -i "s/flutter.targetSdkVersion/34/g" "$GEO_FILE"
          sed -i "s/flutter.ndkVersion/\"27.0.120\"/g" "$GEO_FILE"
          sed -i "s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g" "$GEO_FILE"
          sed -i "s/compileSdk flutter.compileSdkVersion/compileSdk 34/g" "$GEO_FILE"
          # Also add namespace if missing
          if ! grep -q "namespace" "$GEO_FILE"; then
            sed -i "/^android {/a \    namespace 'com.baseflow.geolocator_android'" "$GEO_FILE"
          fi
          echo "--- PATCHED ---"
          cat "$GEO_FILE" | head -60

      - run: flutter clean
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-APK
          path: build/app/outputs/flutter-apk/app-release.apk
