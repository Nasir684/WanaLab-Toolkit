name: build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Build WanaLab v3.4
        run: |
          set -e

          rm -rf android lib test pubspec.yaml pubspec.lock
          flutter create --project-name wana_lab_toolkit --org com.wanalab.toolkit --platforms=android .
          rm -rf test

          mkdir -p lib/services lib/features/sensors lib/features/camera lib/features/religion lib/features/language lib/features/phd lib/features/dev lib/features/detector assets

          pip3 install Pillow -q
          python3 -c "
from PIL import Image, ImageDraw
i = Image.new('RGB', (1024, 1024), (37, 99, 235))
ImageDraw.Draw(i).ellipse([180, 180, 844, 844], fill='white')
i.save('assets/icon.png')
"

          cat > pubspec.yaml << 'EOF'
          name: wana_lab_toolkit
          description: WanaLab Toolkit - local only
          publish_to: 'none'
          version: 3.4.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.3.3
            geolocator: ^13.0.2
            intl: ^0.20.2
            pdf: ^3.11.1
            printing: ^5.12.0
            share_plus: ^10.0.4
            path_provider: ^2.1.4
            file_picker: ^8.1.6
            sensors_plus: ^6.1.1
            mobile_scanner: ^5.2.3
            qr_flutter: ^4.1.0
            image_picker: ^1.1.2
            google_mlkit_text_recognition: ^0.13.1
            adhan: ^2.0.0
            hijri: ^3.0.0
            url_launcher: ^6.2.5
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/icon.png
          EOF

          # Fix NDK + disable minify
          python3 << 'EOF'
          import pathlib, re
          p = pathlib.Path("android/app/build.gradle.kts")
          t = p.read_text()
          t = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", t)
          t = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 23", t)
          if "ndkVersion" not in t:
              t = t.replace("android {", 'android {\n    ndkVersion = "27.0.12077973"')
          else:
              t = re.sub(r'ndkVersion\s*=\s*".*?"', 'ndkVersion = "27.0.12077973"', t)
          t = re.sub(r"isMinifyEnabled\s*=\s*true", "isMinifyEnabled = false", t)
          t = re.sub(r"isShrinkResources\s*=\s*true", "isShrinkResources = false", t)
          if "isMinifyEnabled = false" not in t:
              t = t.replace("buildTypes {", "buildTypes {\n        release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n        }")
          p.write_text(t)
          pathlib.Path("android/app/proguard-rules.pro").write_text("-keep class com.google.mlkit.** { *; }\n-keep class com.google.android.gms.** { *; }\n-dontwarn com.google.mlkit.**\n")
          print("Gradle fixed")
          EOF

          # Create all Dart files
          cat > lib/services/storage_service.dart << 'EOF'
          import 'package:shared_preferences/shared_preferences.dart';
          class StorageService {
            static SharedPreferences? _p;
            static Future<void> init() async { _p = await SharedPreferences.getInstance(); }
            static Future<List<String>> getList(String k) async => _p?.getStringList(k) ?? [];
            static Future<void> setList(String k, List<String> v) async => await _p?.setStringList(k, v);
            static Future<void> clearAll() async => await _p?.clear();
          }
          EOF

          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'services/storage_service.dart';
          import 'app.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await StorageService.init();
            runApp(const WanaLabApp());
          }
          EOF

          # Simple screen template function
          make_screen() {
            cat > "$1" << EOF
          import 'package:flutter/material.dart';
          class $2 extends StatelessWidget {
            const $2({super.key});
            @override
            Widget build(BuildContext context) {
              return const Center(child: Text('$3', style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold)));
            }
          }
          EOF
          }

          make_screen "lib/features/core_screen.dart" "CoreScreen" "Core"
          make_screen "lib/features/gps_screen.dart" "GPSScreen" "GPS"
          make_screen "lib/features/settings_screen.dart" "SettingsScreen" "Settings"
          make_screen "lib/features/about_screen.dart" "AboutScreen" "About"
          make_screen "lib/features/sensors/compass_screen.dart" "CompassScreen" "Compass"
          make_screen "lib/features/camera/barcode_screen.dart" "BarcodeScreen" "Barcode"
          make_screen "lib/features/camera/ocr_screen.dart" "OCRScreen" "OCR"
          make_screen "lib/features/religion/qibla_screen.dart" "QiblaScreen" "Qibla"
          make_screen "lib/features/religion/prayer_screen.dart" "PrayerScreen" "Prayer"
          make_screen "lib/features/religion/tasbih_screen.dart" "TasbihScreen" "Tasbih"
          make_screen "lib/features/religion/zakat_screen.dart" "ZakatScreen" "Zakat"
          make_screen "lib/features/language/translator_screen.dart" "TranslatorScreen" "Translator"
          make_screen "lib/features/phd/citation_screen.dart" "CitationScreen" "Citation"
          make_screen "lib/features/phd/statistics_screen.dart" "StatisticsScreen" "Statistics"
          make_screen "lib/features/phd/notes_screen.dart" "NotesScreen" "Notes"
          make_screen "lib/features/phd/unit_converter_screen.dart" "UnitConverterScreen" "Unit Converter"
          make_screen "lib/features/dev/developer_screen.dart" "DeveloperScreen" "Developer"
          make_screen "lib/features/dev/pricing_screen.dart" "PricingScreen" "Pricing"
          make_screen "lib/features/dev/demo_screen.dart" "DemoScreen" "Demo"
          make_screen "lib/features/dev/changelog_screen.dart" "ChangelogScreen" "Changelog"
          make_screen "lib/features/dev/roadmap_screen.dart" "RoadmapScreen" "Roadmap"
          make_screen "lib/features/detector/emi_screen.dart" "EMIScreen" "EMI"
          make_screen "lib/features/detector/detector_screen.dart" "DetectorScreen" "Detector"

          # Dashboard (special)
          cat > lib/features/dashboard_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          class DashboardScreen extends StatelessWidget {
            final void Function(int) onNav;
            const DashboardScreen({super.key, required this.onNav});
            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const Text('WanaLab v3.4 FULL', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold)),
                  const SizedBox(height: 20),
                  Wrap(
                    spacing: 8,
                    runSpacing: 8,
                    children: List.generate(24, (i) {
                      return ElevatedButton(
                        onPressed: () => onNav(i + 1),
                        child: Text('Go ${i + 1}'),
                      );
                    }),
                  ),
                ],
              );
            }
          }
          EOF

          # Import/Export
          cat > lib/features/import_export_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          import '../services/storage_service.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:file_picker/file_picker.dart';
          import 'dart:io';
          import 'package:intl/intl.dart';

          class ImportExportScreen extends StatefulWidget {
            const ImportExportScreen({super.key});
            @override
            State<ImportExportScreen> createState() => _ImportExportState();
          }

          class _ImportExportState extends State<ImportExportScreen> {
            String status = 'Ready - Local-only';
            String preview = '';

            Future<void> exportFile() async {
              final cores = await StorageService.getList('cores');
              final report = 'WanaLab v3.4 FULL\nDate: \( {DateFormat('yyyy-MM-dd HH:mm').format(DateTime.now())}\n \){cores.join('\n')}';
              final dir = await getTemporaryDirectory();
              final file = File('${dir.path}/Export.txt');
              await file.writeAsString(report);
              setState(() { status = 'Exported'; preview = report; });
              await Share.shareXFiles([XFile(file.path)]);
            }

            Future<void> importFile() async {
              try {
                final r = await FilePicker.platform.pickFiles();
                if (r != null && r.files.single.path != null) {
                  final f = File(r.files.single.path!);
                  final c = await f.readAsString();
                  setState(() {
                    status = 'Imported';
                    preview = c.length > 800 ? c.substring(0, 800) : c;
                  });
                }
              } catch (e) {
                setState(() => status = 'Failed: $e');
              }
            }

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(12),
                children: [
                  Card(child: Padding(padding: const EdgeInsets.all(12), child: Text(status))),
                  const SizedBox(height: 12),
                  FilledButton.icon(onPressed: exportFile, icon: const Icon(Icons.file_present), label: const Text('EXPORT TXT')),
                  const SizedBox(height: 8),
                  FilledButton.tonalIcon(onPressed: importFile, icon: const Icon(Icons.file_upload), label: const Text('IMPORT File')),
                  const SizedBox(height: 16),
                  Container(
                    padding: const EdgeInsets.all(12),
                    color: Colors.grey.shade100,
                    child: SelectableText(preview.isEmpty ? 'No data yet' : preview),
                  ),
                ],
              );
            }
          }
          EOF

          # app.dart
          cat > lib/app.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'features/dashboard_screen.dart';
          import 'features/core
