name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Safe download - skip long files
        run: |
          python3 - << 'PY'
          import tarfile, urllib.request, os
          url = "https://github.com/Nasir684/WanaLab-Toolkit/archive/main.tar.gz"
          urllib.request.urlretrieve(url, "repo.tar.gz")
          with tarfile.open("repo.tar.gz", "r:gz") as tar:
              for m in tar.getmembers():
                  if "/" not in m.name: continue
                  inner = m.name.split("/",1)[1]
                  if not (inner.startswith("lib/") or inner.startswith("android/") or inner == "pubspec.yaml"): continue
                  if len(inner) > 120: continue
                  d = os.path.dirname(inner)
                  if d: os.makedirs(d, exist_ok=True)
                  if m.isfile():
                      f = tar.extractfile(m)
                      if f: open(inner, "wb").write(f.read())
          print("Extract OK")
          PY

      - name: Fix geolocator compileSdk bug
        run: |
          # 1. Create local.properties that geolocator needs
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          cat android/local.properties

          # 2. Force compileSdk 34 in app build.gradle
          sed -i "s/flutter.compileSdkVersion/34/g" android/app/build.gradle || true
          sed -i "s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g" android/app/build.gradle || true
          sed -i "s/compileSdk flutter.compileSdkVersion/compileSdk 34/g" android/app/build.gradle || true

          # 3. Add namespace if missing
          if ! grep -q "namespace" android/app/build.gradle; then
            sed -i "/^android {/a \    namespace 'com.example.wana_lab_toolkit'" android/app/build.gradle
          fi
          cat android/app/build.gradle | head -40

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-APK
          path: build/app/outputs/flutter-apk/app-release.apk
