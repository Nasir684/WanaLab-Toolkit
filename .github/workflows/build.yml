name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.29.3', channel: 'stable'}

      - name: Build FINAL WanaLab Toolkit
        run: |
          rm -rf android lib test pubspec.yaml pubspec.lock
          flutter create --project-name wana_lab_toolkit --org com.wanalab.toolkit --platforms=android .
          rm -rf test
          mkdir -p lib/services lib/features assets

          # Create App Icon (Blue Lab)
          python3 -c "
          from PIL import Image, ImageDraw
          import os
          img = Image.new('RGB', (1024,1024), (37, 99, 235))
          d = ImageDraw.Draw(img)
          d.ellipse([256,256,768,768], fill='white')
          d.text((400,420), 'WL', fill=(37,99,235), font_size=280)
          os.makedirs('assets', exist_ok=True)
          img.save('assets/icon.png')
          print('icon created')
          "

          cat > pubspec.yaml << 'YAML'
          name: wana_lab_toolkit
          description: WanaLab Toolkit - Professional Field Lab
          publish_to: 'none'
          version: 1.0.0+2
          environment: {sdk: '>=3.2.0 <4.0.0'}
          dependencies:
            flutter: {sdk: flutter}
            shared_preferences: ^2.3.3
            geolocator: ^13.0.2
            intl: ^0.20.2
            pdf: ^3.11.1
            printing: ^5.12.0
            share_plus: ^10.0.4
            path_provider: ^2.1.4
          dev_dependencies: {flutter_test: {sdk: flutter}, flutter_lints: ^4.0.0}
          flutter:
            uses-material-design: true
            assets: [assets/icon.png]
          YAML

          cat > lib/services/storage_service.dart << 'DART'
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:convert';
          class StorageService {
            static SharedPreferences? _prefs;
            static Future<void> init() async { _prefs = await SharedPreferences.getInstance(); }
            static Future<List<String>> getList(String k) async => _prefs?.getStringList(k) ?? [];
            static Future<void> setList(String k, List<String> v) async => await _prefs?.setStringList(k, v);
            static Future<void> clearAll() async => await _prefs?.clear();
          }
          DART

          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'services/storage_service.dart';
          import 'app.dart';
          void main() async { WidgetsFlutterBinding.ensureInitialized(); await StorageService.init(); runApp(const WanaLabApp()); }
          DART

          cat > lib/app.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'features/dashboard_screen.dart'; import 'features/core_screen.dart'; import 'features/gps_screen.dart'; import 'features/baby_screen.dart'; import 'features/emi_screen.dart'; import 'features/gym_screen.dart'; import 'features/workshop_screen.dart'; import 'features/varrho_screen.dart'; import 'features/import_export_screen.dart'; import 'features/settings_screen.dart'; import 'features/gallery_screen.dart'; import 'features/about_screen.dart';
          class WanaLabApp extends StatelessWidget { const WanaLabApp({super.key}); @override Widget build(BuildContext context) { return MaterialApp(title: 'WanaLab Toolkit', debugShowCheckedModeBanner: false, theme: ThemeData(useMaterial3: true, colorSchemeSeed: Color(0xFF2563EB)), home: const MainScaffold()); } }
          class MainScaffold extends StatefulWidget { const MainScaffold({super.key}); @override State<MainScaffold> createState() => _MainState(); }
          class _MainState extends State<MainScaffold> {
            int idx=0;
            void go(int i){ setState(()=>idx=i); }
            @override Widget build(BuildContext context){
              final screens=[DashboardScreen(onNav: go), const CoreScreen(), const GPSScreen(), const BabyScreen(), const EMIScreen(), const GymScreen(), const WorkshopScreen(), const VarRhoScreen(), const ImportExportScreen(), const SettingsScreen(), const GalleryScreen(), const AboutScreen()];
              final titles=["Dashboard","Core Cutter","GPS Logger","Baby Tracker","EMI Calc","Gym/BMI","Workshop","Var Rho","Data Export","Settings","Gallery","About"];
              return Scaffold(appBar: AppBar(title: Text(titles[idx]), centerTitle: true), body: screens[idx], bottomNavigationBar: NavigationBar(selectedIndex: idx>4?0:idx, onDestinationSelected: (v)=>setState(()=>idx=v), destinations: const [NavigationDestination(icon: Icon(Icons.dashboard), label: 'Dash'), NavigationDestination(icon: Icon(Icons.science), label: 'Core'), NavigationDestination(icon: Icon(Icons.gps_fixed), label: 'GPS'), NavigationDestination(icon: Icon(Icons.child_friendly), label: 'Baby'), NavigationDestination(icon: Icon(Icons.calculate), label: 'EMI')]), drawer: Drawer(child: ListView(padding: EdgeInsets.zero, children: [DrawerHeader(decoration: const BoxDecoration(color: Color(0xFF2563EB)), child: Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisAlignment: MainAxisAlignment.end, children: [Icon(Icons.biotech, size: 48, color: Colors.white), SizedBox(height:12), Text('WanaLab Toolkit', style: TextStyle(color: Colors.white, fontSize: 22, fontWeight: FontWeight.bold))])), ...List.generate(titles.length, (i)=>ListTile(leading: Icon([Icons.dashboard, Icons.science, Icons.gps_fixed, Icons.child_friendly, Icons.calculate, Icons.fitness_center, Icons.handyman, Icons.water_drop, Icons.import_export, Icons.settings, Icons.photo, Icons.info][i]), title: Text(titles[i]), selected: i==idx, onTap: (){setState(()=>idx=i); Navigator.pop(context);} ))]))); }
          }
          DART

          cat > lib/features/dashboard_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart';
          class DashboardScreen extends StatefulWidget { final Function(int) onNav; const DashboardScreen({super.key, required this.onNav}); @override State<DashboardScreen> createState()=>_D(); }
          class _D extends State<DashboardScreen> { int cores=0,gps=0; @override void initState(){super.initState(); _load();} Future<void> _load() async { final c=await StorageService.getList('cores'); final g=await StorageService.getList('gps'); if(!mounted) return; setState((){cores=c.length; gps=g.length;}); } @override Widget build(BuildContext context){ return ListView(padding: const EdgeInsets.all(16), children: [Card(elevation:2, child: Padding(padding: const EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [const Text('WanaLab Toolkit', style: TextStyle(fontSize:22, fontWeight: FontWeight.bold)), const Text('All-in-one field lab toolkit'), const SizedBox(height:16), Row(children: [Expanded(child: _stat('Cores', '$cores', Colors.green)), const SizedBox(width:12), Expanded(child: _stat('GPS', '$gps', Colors.blue))])]))), const SizedBox(height:12), GridView.count(crossAxisCount:2, shrinkWrap:true, physics: const NeverScrollableScrollPhysics(), mainAxisSpacing:12, crossAxisSpacing:12, children: [_card('Core Test','Soil density',Icons.science, Colors.green, 1), _card('GPS Logger','Save locations',Icons.gps_fixed, Colors.blue, 2), _card('EMI Calc','Loan EMI',Icons.calculate, Colors.orange, 4), _card('BMI/Gym','Health',Icons.fitness_center, Colors.purple, 5), _card('Baby Tracker','Growth',Icons.child_friendly, Colors.pink, 3), _card('Workshop','Inventory',Icons.handyman, Colors.brown, 6)])]); } Widget _stat(String t,String v,Color c){ return Container(padding: const EdgeInsets.all(16), decoration: BoxDecoration(color: c.withOpacity(0.1), borderRadius: BorderRadius.circular(16)), child: Column(children: [Text(v, style: TextStyle(fontSize:24, fontWeight: FontWeight.bold, color:c)), Text(t)])); } Widget _card(String a,String b,IconData ic,Color c,int nav){ return InkWell(onTap: ()=>widget.onNav(nav), borderRadius: BorderRadius.circular(16), child: Card(child: Padding(padding: const EdgeInsets.all(16), child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(ic, color:c, size:36), const SizedBox(height:8), Text(a, style: const TextStyle(fontWeight: FontWeight.bold)), Text(b, style: const TextStyle(fontSize:12, color: Colors.grey))])))); } }
          DART

          cat > lib/features/core_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart'; import 'package:intl/intl.dart'; import 'package:pdf/pdf.dart'; import 'package:pdf/widgets.dart' as pw; import 'package:printing/printing.dart'; import 'package:share_plus/share_plus.dart';
          class CoreScreen extends StatefulWidget { const CoreScreen({super.key}); @override State<CoreScreen> createState()=>_C(); }
          class _C extends State<CoreScreen> { final wtCtrl=TextEditingController(), wcCtrl=TextEditingController(text:'100'), vcCtrl=TextEditingController(text:'1000'), wCtrl=TextEditingController(), locCtrl=TextEditingController(); double bulk=0,dry=0,mc=0; List<String> hist=[]; @override void initState(){super.initState(); _loadHist();} Future<void> _loadHist() async { hist=await StorageService.getList('cores'); if(mounted) setState((){}); } void calc(){ double wt=double.tryParse(wtCtrl.text)??0; double wc=double.tryParse(wcCtrl.text)??0; double vc=double.tryParse(vcCtrl.text)??1000; double w=double.tryParse(wCtrl.text)??0; if(wt==0||vc==0){ return; } bulk=(wt-wc)/vc; mc=w; dry=bulk/(1+mc/100); setState((){}); } Future<void> save() async { if(bulk==0){ return; } final f=DateFormat('dd-MM HH:mm').format(DateTime.now()); hist.add('$f | ${locCtrl.text} | Bulk:${bulk.toStringAsFixed(3)} Dry:${dry.toStringAsFixed(3)} MC:${mc}%'); await StorageService.setList('cores', hist); if(mounted) setState((){}); } Future<void> makePdf() async { final doc=pw.Document(); doc.addPage(pw.Page(build: (c)=>pw.Column(crossAxisAlignment: pw.CrossAxisAlignment.start, children: [pw.Text('WanaLab - Core Cutter Report', style: pw.TextStyle(fontSize: 22, fontWeight: pw.FontWeight.bold)), pw.SizedBox(height:20), pw.Text('Location: ${locCtrl.text}'), pw.Text('Bulk Density: ${bulk.toStringAsFixed(3)} g/cc'), pw.Text('Dry Density: ${dry.toStringAsFixed(3)} g/cc'), pw.Text('Water Content: $mc %'), pw.Text('Date: ${DateFormat('yyyy-MM-dd HH:mm').format(DateTime.now())}'), pw.Divider(), pw.Text('Generated by WanaLab Toolkit')]))); await Printing.layoutPdf(onLayout: (f) async => doc.save()); } Future<void> share() async { if(bulk==0){ return; } await Share.share('WanaLab Core Report\nLocation: ${locCtrl.text}\nBulk: ${bulk.toStringAsFixed(3)} g/cc\nDry: ${dry.toStringAsFixed(3)} g/cc\nMC: $mc%'); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [TextField(controller: locCtrl, decoration: const InputDecoration(labelText:'Location / Chainage', border: OutlineInputBorder(), prefixIcon: Icon(Icons.location_on))), const SizedBox(height:8), TextField(controller: wtCtrl, decoration: const InputDecoration(labelText:'Wt. core+soil (g)', border: OutlineInputBorder()), keyboardType: TextInputType.number), const SizedBox(height:8), Row(children: [Expanded(child: TextField(controller: wcCtrl, decoration: const InputDecoration(labelText:'Wt. core (g)', border: OutlineInputBorder()), keyboardType: TextInputType.number)), const SizedBox(width:8), Expanded(child: TextField(controller: vcCtrl, decoration: const InputDecoration(labelText:'Vol cc', border: OutlineInputBorder()), keyboardType: TextInputType.number))]), const SizedBox(height:8), TextField(controller: wCtrl, decoration: const InputDecoration(labelText:'Water content %', border: OutlineInputBorder()), keyboardType: TextInputType.number), const SizedBox(height:12), FilledButton.icon(onPressed: calc, icon: const Icon(Icons.calculate), label: const Text('Calculate')), const SizedBox(height:8), Card(color: Colors.indigo.shade50, child: Padding(padding: const EdgeInsets.all(16), child: Column(children: [Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [const Text('Bulk Density:'), Text('${bulk.toStringAsFixed(3)} g/cc', style: const TextStyle(fontWeight: FontWeight.bold))]), Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [const Text('Dry Density:'), Text('${dry.toStringAsFixed(3)} g/cc', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.green))]), Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [const Text('MC:'), Text('$mc %')])]))), Row(children: [Expanded(child: FilledButton.tonal(onPressed: save, child: const Text('Save'))), const SizedBox(width:8), Expanded(child: OutlinedButton.icon(onPressed: makePdf, icon: const Icon(Icons.picture_as_pdf), label: const Text('PDF'))), const SizedBox(width:8), Expanded(child: OutlinedButton.icon(onPressed: share, icon: const Icon(Icons.share), label: const Text('Share')))]), const Divider(), const Text('History', style: TextStyle(fontWeight: FontWeight.bold)), ...hist.reversed.map((e)=>Card(child: ListTile(dense:true, title: Text(e, style: const TextStyle(fontSize:11)))))]); } }
          DART

          cat > lib/features/gps_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import 'package:geolocator/geolocator.dart'; import '../services/storage_service.dart'; import 'package:share_plus/share_plus.dart';
          class GPSScreen extends StatefulWidget { const GPSScreen({super.key}); @override State<GPSScreen> createState()=>_G(); }
          class _G extends State<GPSScreen> { String loc='Press Get Location'; List<String> points=[]; Position? lastPos; @override void initState(){super.initState(); _load();} Future<void> _load() async { points=await StorageService.getList('gps'); if(mounted) setState((){}); } Future<void> getLoc() async { bool s=await Geolocator.isLocationServiceEnabled(); if(!s){ if(!mounted) return; setState(()=>loc='GPS disabled - Enable location'); return;} LocationPermission p=await Geolocator.checkPermission(); if(p==LocationPermission.denied){ p=await Geolocator.requestPermission();} lastPos=await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high); if(!mounted) return; setState(()=>loc='${lastPos!.latitude.toStringAsFixed(6)}, ${lastPos!.longitude.toStringAsFixed(6)}\nAccuracy: ${lastPos!.accuracy.toStringAsFixed(1)}m\nhttps://maps.google.com/?q=${lastPos!.latitude},${lastPos!.longitude}'); } Future<void> saveP() async { if(loc.contains('Press')){ return; } points.add('${DateTime.now().toString().substring(0,19)} | $loc'); await StorageService.setList('gps', points); if(mounted) setState((){}); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [Card(child: Padding(padding: const EdgeInsets.all(16), child: SelectableText(loc, style: const TextStyle(fontSize:15)))), const SizedBox(height:12), Row(children: [Expanded(child: FilledButton.icon(onPressed: getLoc, icon: const Icon(Icons.my_location), label: const Text('Get Location'))), const SizedBox(width:8), Expanded(child: FilledButton.tonal(onPressed: saveP, child: const Text('Save Point')))]), if(lastPos!=null) FilledButton.icon(onPressed: ()=>Share.share('My Location: ${lastPos!.latitude}, ${lastPos!.longitude}\nhttps://maps.google.com/?q=${lastPos!.latitude},${lastPos!.longitude}'), icon: const Icon(Icons.share), label: const Text('Share Location')), const Divider(), Text('Saved Points: ${points.length}', style: const TextStyle(fontWeight: FontWeight.bold)), ...points.reversed.map((e)=>Card(child: ListTile(dense:true, title: SelectableText(e, style: const TextStyle(fontSize:11)), trailing: IconButton(icon: const Icon(Icons.share), onPressed: ()=>Share.share(e)))))]); } }
          DART

          cat > lib/features/baby_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart';
          class BabyScreen extends StatefulWidget { const BabyScreen({super.key}); @override State<BabyScreen> createState()=>_B(); }
          class _B extends State<BabyScreen> { final w=TextEditingController(), h=TextEditingController(), a=TextEditingController(); List<String> hist=[]; double bmi=0; @override void initState(){super.initState(); _load();} Future<void> _load() async { hist=await StorageService.getList('baby'); if(mounted) setState((){}); } void calc(){ double ww=double.tryParse(w.text)??0; double hh=double.tryParse(h.text)??0; if(ww==0||hh==0){ return; } bmi=ww/((hh/100)*(hh/100)); setState((){}); } Future<void> save() async { if(bmi==0){ return; } hist.add('${a.text.isEmpty?'Baby':a.text}: ${w.text}kg, ${h.text}cm, BMI:${bmi.toStringAsFixed(1)}'); await StorageService.setList('baby', hist); if(mounted) setState((){}); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [TextField(controller: a, decoration: const InputDecoration(labelText:'Name / Age', border: OutlineInputBorder())), const SizedBox(height:8), Row(children: [Expanded(child: TextField(controller: w, decoration: const InputDecoration(labelText:'Weight kg', border: OutlineInputBorder()), keyboardType: TextInputType.number)), const SizedBox(width:8), Expanded(child: TextField(controller: h, decoration: const InputDecoration(labelText:'Height cm', border: OutlineInputBorder()), keyboardType: TextInputType.number))]), const SizedBox(height:12), FilledButton(onPressed: calc, child: const Text('Calculate BMI')), Card(child: Padding(padding: const EdgeInsets.all(16), child: Center(child: Text('BMI: ${bmi.toStringAsFixed(1)}', style: const TextStyle(fontSize:24, fontWeight: FontWeight.bold))))), FilledButton.tonal(onPressed: save, child: const Text('Save Record')), ...hist.map((e)=>ListTile(title: Text(e))) ]); } }
          DART

          cat > lib/features/emi_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import 'dart:math';
          class EMIScreen extends StatefulWidget { const EMIScreen({super.key}); @override State<EMIScreen> createState()=>_E(); }
          class _E extends State<EMIScreen> { final p=TextEditingController(text:'100000'), r=TextEditingController(text:'10'), n=TextEditingController(text:'12'); double emi=0,total=0,interest=0; void calc(){ double P=double.tryParse(p.text)??0; double R=double.tryParse(r.text)??0; double N=double.tryParse(n.text)??0; if(P==0||N==0){ return; } double mr=R/12/100; if(mr==0){ emi=P/N; } else { emi= P*mr*pow(mr+1,N)/(pow(mr+1,N)-1); } total=emi*N; interest=total-P; setState((){}); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [TextField(controller: p, decoration: const InputDecoration(labelText:'Principal', border: OutlineInputBorder()), keyboardType: TextInputType.number), const SizedBox(height:8), Row(children: [Expanded(child: TextField(controller: r, decoration: const InputDecoration(labelText:'Annual Rate %', border: OutlineInputBorder()), keyboardType: TextInputType.number)), const SizedBox(width:8), Expanded(child: TextField(controller: n, decoration: const InputDecoration(labelText:'Months', border: OutlineInputBorder()), keyboardType: TextInputType.number))]), const SizedBox(height:12), FilledButton(onPressed: calc, child: const Text('Calculate EMI')), const SizedBox(height:12), Card(child: Padding(padding: const EdgeInsets.all(16), child: Column(children: [Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [const Text('Monthly EMI:'), Text('Rs ${emi.toStringAsFixed(2)}', style: const TextStyle(fontWeight: FontWeight.bold))]), Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [const Text('Total Payment:'), Text('Rs ${total.toStringAsFixed(2)}')]), Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [const Text('Total Interest:'), Text('Rs ${interest.toStringAsFixed(2)}', style: const TextStyle(color: Colors.red))])])))]); } }
          DART

          cat > lib/features/gym_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          class GymScreen extends StatefulWidget { const GymScreen({super.key}); @override State<GymScreen> createState()=>_GY(); }
          class _GY extends State<GymScreen> { final w=TextEditingController(), h=TextEditingController(); double bmi=0; String cat=''; void calc(){ double ww=double.tryParse(w.text)??0; double hh=double.tryParse(h.text)??0; if(hh==0){ return; } bmi=ww/((hh/100)*(hh/100)); if(bmi<18.5){ cat='Underweight'; } else if(bmi<25){ cat='Normal - Good'; } else if(bmi<30){ cat='Overweight'; } else { cat='Obese'; } setState((){}); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [TextField(controller: w, decoration: const InputDecoration(labelText:'Weight kg', border: OutlineInputBorder()), keyboardType: TextInputType.number), const SizedBox(height:8), TextField(controller: h, decoration: const InputDecoration(labelText:'Height cm', border: OutlineInputBorder()), keyboardType: TextInputType.number), const SizedBox(height:12), FilledButton(onPressed: calc, child: const Text('Calculate BMI')), Card(color: Colors.purple.shade50, child: Padding(padding: const EdgeInsets.all(24), child: Column(children: [Text('${bmi.toStringAsFixed(1)}', style: const TextStyle(fontSize:42, fontWeight: FontWeight.bold)), Text(cat, style: const TextStyle(fontSize:18))]))), const Text('Ideal: 18.5 - 24.9 Normal')]); } }
          DART

          cat > lib/features/workshop_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart';
          class WorkshopScreen extends StatefulWidget { const WorkshopScreen({super.key}); @override State<WorkshopScreen> createState()=>_W(); }
          class _W extends State<WorkshopScreen> { final c=TextEditingController(); List<String> items=[]; @override void initState(){super.initState(); _load();} Future<void> _load() async { items=await StorageService.getList('workshop'); if(mounted) setState((){}); } Future<void> add() async { if(c.text.isEmpty){ return; } items.add(c.text); await StorageService.setList('workshop', items); c.clear(); if(mounted) setState((){}); } @override Widget build(BuildContext cxt){ return ListView(padding: const EdgeInsets.all(16), children: [Row(children: [Expanded(child: TextField(controller: c, decoration: const InputDecoration(labelText:'Add Item / Tool', border: OutlineInputBorder()))), const SizedBox(width:8), FilledButton(onPressed: add, child: const Text('Add'))]), const SizedBox(height:12), ...items.map((e)=>Card(child: ListTile(title: Text(e), trailing: IconButton(icon: const Icon(Icons.delete), onPressed: () async { items.remove(e); await StorageService.setList('workshop', items); if(mounted) setState((){}); })) )) ]); } }
