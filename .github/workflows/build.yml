name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only needed files (skip long build folder)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            lib
            android
            ios
            assets
            web
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            .gitignore
            README.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Build clean APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: WanaLab-APK-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
