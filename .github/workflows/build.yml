name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Safe download - skip long files
        run: |
          python3 - << 'PY'
          import tarfile, urllib.request, os
          url = "https://github.com/Nasir684/WanaLab-Toolkit/archive/main.tar.gz"
          urllib.request.urlretrieve(url, "repo.tar.gz")
          with tarfile.open("repo.tar.gz", "r:gz") as tar:
              for m in tar.getmembers():
                  if "/" not in m.name:
                      continue
                  inner = m.name.split("/",1)[1]
                  if not (inner.startswith("lib/") or inner.startswith("android/") or inner == "pubspec.yaml"):
                      continue
                  if len(inner) > 120:
                      print(f"SKIPPED long: {inner[:80]}")
                      continue
                  # Fix: only makedirs if dirname exists
                  d = os.path.dirname(inner)
                  if d:
                      os.makedirs(d, exist_ok=True)
                  if m.isfile():
                      f = tar.extractfile(m)
                      if f:
                          open(inner, "wb").write(f.read())
          print("Safe extract OK")
          PY
          ls -la
          cat pubspec.yaml | head -20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-APK
          path: build/app/outputs/flutter-apk/app-release.apk
