name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.29.3', channel: 'stable'}
      - name: Build WanaLab v3.4 FULL FIX R8+NDK+Dart
        run: |
          rm -rf android lib test pubspec.yaml pubspec.lock
          flutter create --project-name wana_lab_toolkit --org com.wanalab.toolkit --platforms=android .
          rm -rf test
          mkdir -p lib/services lib/features/sensors lib/features/camera lib/features/religion lib/features/language lib/features/phd lib/features/dev lib/features/detector assets
          pip3 install Pillow -q
          python3 -c "from PIL import Image,ImageDraw; i=Image.new('RGB',(1024,1024),(37,99,235)); ImageDraw.Draw(i).ellipse([180,180,844,844], fill='white'); i.save('assets/icon.png')"

          cat > pubspec.yaml << 'YAML'
          name: wana_lab_toolkit
          description: Research-oriented platform for engineering estimation, EMI screening, detector analysis & scientific workflow support (evolution through 2037). Local-only, privacy-first, no login, no cloud. By Nasir Khan
          publish_to: 'none'
          version: 3.4.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter: {sdk: flutter}
            shared_preferences: ^2.3.3
            geolocator: ^13.0.2
            intl: ^0.20.2
            pdf: ^3.11.1
            printing: ^5.12.0
            share_plus: ^10.0.4
            path_provider: ^2.1.4
            file_picker: ^8.1.6
            sensors_plus: ^6.1.1
            mobile_scanner: ^5.2.3
            qr_flutter: ^4.1.0
            image_picker: ^1.1.2
            google_mlkit_text_recognition: ^0.13.1
            adhan: ^2.0.0
            hijri: ^3.0.0
            url_launcher: ^6.2.5
          dev_dependencies:
            flutter_test: {sdk: flutter}
            flutter_lints: ^4.0.0
          flutter:
            uses-material-design: true
            assets: [assets/icon.png]
          YAML

          # --- FIX 1: NDK 27.0.12077973 + FIX 2: DISABLE R8 ---
          python3 << 'PY'
          import pathlib, re
          p=pathlib.Path("android/app/build.gradle.kts")
          t=p.read_text()
          t=re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", t)
          t=re.sub(r"minSdk\s*=\s*\d+", "minSdk = 23", t)
          if "ndkVersion" not in t:
              t=t.replace("android {", 'android {\n    ndkVersion = "27.0.12077973"')
          else:
              t=re.sub(r'ndkVersion\s*=\s*".*?"', 'ndkVersion = "27.0.12077973"', t)
          t=re.sub(r"isMinifyEnabled\s*=\s*true", "isMinifyEnabled = false", t)
          t=re.sub(r"isShrinkResources\s*=\s*true", "isShrinkResources = false", t)
          if "isMinifyEnabled = false" not in t:
              t=t.replace("buildTypes {", "buildTypes {\n        release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n        }")
          p.write_text(t)
          pathlib.Path("android/app/proguard-rules.pro").write_text("-keep class com.google.mlkit.** { *; }\n-keep class com.google.android.gms.** { *; }\n-dontwarn com.google.mlkit.**\n")
          PY

          # --- MAIN FIX: generate ALL missing screens so Dart compiles (single-line strings, YAML-safe) ---
          python3 << 'PY'
          import pathlib
          screens = {
            'core_screen.dart': ('CoreScreen', 'Core'),
            'gps_screen.dart': ('GPSScreen', 'GPS'),
            'settings_screen.dart': ('SettingsScreen', 'Settings'),
            'about_screen.dart': ('AboutScreen', 'About'),
            'sensors/compass_screen.dart': ('CompassScreen', 'Compass'),
            'camera/barcode_screen.dart': ('BarcodeScreen', 'Barcode'),
            'camera/ocr_screen.dart': ('OCRScreen', 'OCR'),
            'religion/qibla_screen.dart': ('QiblaScreen', 'Qibla'),
            'religion/prayer_screen.dart': ('PrayerScreen', 'Prayer'),
            'religion/tasbih_screen.dart': ('TasbihScreen', 'Tasbih'),
            'religion/zakat_screen.dart': ('ZakatScreen', 'Zakat'),
            'language/translator_screen.dart': ('TranslatorScreen', 'Translator'),
            'phd/citation_screen.dart': ('CitationScreen', 'Citation'),
            'phd/statistics_screen.dart': ('StatisticsScreen', 'Statistics'),
            'phd/notes_screen.dart': ('NotesScreen', 'Notes'),
            'phd/unit_converter_screen.dart': ('UnitConverterScreen', 'Unit Converter'),
            'dev/developer_screen.dart': ('DeveloperScreen', 'Developer'),
            'dev/pricing_screen.dart': ('PricingScreen', 'Pricing'),
            'dev/demo_screen.dart': ('DemoScreen', 'Demo'),
            'dev/changelog_screen.dart': ('ChangelogScreen', 'Changelog'),
            'dev/roadmap_screen.dart': ('RoadmapScreen', 'Roadmap'),
            'detector/emi_screen.dart': ('EMIScreen', 'EMI'),
            'detector/detector_screen.dart': ('DetectorScreen', 'Detector'),
          }
          tpl = "import 'package:flutter/material.dart';\nclass {cls} extends StatelessWidget {{\n  const {cls}({{super.key}});\n  @override\n  Widget build(BuildContext c) => Center(child: Text('{title}'));\n}}\n"
          for path, (cls, title) in screens.items():
              f = pathlib.Path('lib/features') / path
              f.parent.mkdir(parents=True, exist_ok=True)
              f.write_text(tpl.format(cls=cls, title=title))
          dash = "import 'package:flutter/material.dart';\nclass DashboardScreen extends StatelessWidget {\n  final void Function(int)? onNav;\n  const DashboardScreen({super.key, this.onNav});\n  @override\n  Widget build(BuildContext c) {\n    final items = ['Core','GPS','Export','Settings','About','Compass','Barcode','OCR','Qibla','Prayer','Tasbih','Zakat','Translator','Citation','Statistics','Notes','Units','Author','Pricing','Demo','Changelog','Roadmap','EMI','Detector'];\n    return GridView.count(crossAxisCount: 2, padding: const EdgeInsets.all(8), children: [for (var i = 0; i < items.length; i++) Card(child: InkWell(onTap: () => onNav?.call(i + 1), child: Center(child: Text(items[i]))))]);\n  }\n}\n"
          pathlib.Path('lib/features/dashboard_screen.dart').write_text(dash)
          print('screens created OK')
          PY

          cat > lib/services/storage_service.dart << 'DART'
          import 'package:shared_preferences/shared_preferences.dart';
          class StorageService {
            static SharedPreferences? _p;
            static Future<void> init() async { _p = await SharedPreferences.getInstance(); }
            static Future<List<String>> getList(String k) async => _p?.getStringList(k) ?? [];
            static Future<void> setList(String k, List<String> v) async => await _p?.setStringList(k, v);
            static Future<void> clearAll() async => await _p?.clear();
          }
          DART

          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'services/storage_service.dart';
          import 'app.dart';
          void main() async { WidgetsFlutterBinding.ensureInitialized(); await StorageService.init(); runApp(const WanaLabApp()); }
          DART

          cat > lib/app.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'features/dashboard_screen.dart';
          import 'features/core_screen.dart';
          import 'features/gps_screen.dart';
          import 'features/import_export_screen.dart';
          import 'features/settings_screen.dart';
          import 'features/about_screen.dart';
          import 'features/sensors/compass_screen.dart';
          import 'features/camera/barcode_screen.dart';
          import 'features/camera/ocr_screen.dart';
          import 'features/religion/qibla_screen.dart';
          import 'features/religion/prayer_screen.dart';
          import 'features/religion/tasbih_screen.dart';
          import 'features/religion/zakat_screen.dart';
          import 'features/language/translator_screen.dart';
          import 'features/phd/citation_screen.dart';
          import 'features/phd/statistics_screen.dart';
          import 'features/phd/notes_screen.dart';
          import 'features/phd/unit_converter_screen.dart';
          import 'features/dev/developer_screen.dart';
          import 'features/dev/pricing_screen.dart';
          import 'features/dev/demo_screen.dart';
          import 'features/dev/changelog_screen.dart';
          import 'features/dev/roadmap_screen.dart';
          import 'features/detector/emi_screen.dart';
          import 'features/detector/detector_screen.dart';
          class WanaLabApp extends StatelessWidget { const WanaLabApp({super.key}); @override Widget build(BuildContext c) => MaterialApp(title:'WanaLab FULL', debugShowCheckedModeBanner:false, theme:ThemeData(useMaterial3:true, colorSchemeSeed: Color(0xFF2563EB)), home: const MainScaffold()); }
          class MainScaffold extends StatefulWidget { const MainScaffold({super.key}); @override State<MainScaffold> createState()=> _M(); }
          class _M extends State<MainScaffold>{ int idx=0; void go(int i)=> setState(()=> idx=i); final titles=["Dashboard","Core","GPS","Export","Settings","About","Compass","Barcode","OCR","Qibla","Prayer","Tasbih","Zakat","Trans","Cite","Stats","Notes","Units","Author","Pricing","Demo","Changelog","Roadmap","EMI","Detector"]; late final List<Widget> screens; @override void initState(){ super.initState(); screens=[DashboardScreen(onNav: go), const CoreScreen(), const GPSScreen(), const ImportExportScreen(), const SettingsScreen(), const AboutScreen(), const CompassScreen(), const BarcodeScreen(), const OCRScreen(), const QiblaScreen(), const PrayerScreen(), const TasbihScreen(), const ZakatScreen(), const TranslatorScreen(), const CitationScreen(), const StatisticsScreen(), const NotesScreen(), const UnitConverterScreen(), const DeveloperScreen(), const PricingScreen(), const DemoScreen(), const ChangelogScreen(), const RoadmapScreen(), const EMIScreen(), const DetectorScreen()];} @override Widget build(BuildContext c)=> Scaffold(appBar: AppBar(title: Text(titles[idx]), centerTitle:true), body: idx==0? DashboardScreen(onNav: go): screens[idx]); }
          DART

          cat > lib/features/import_export_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          import '../services/storage_service.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:file_picker/file_picker.dart';
          import 'dart:io';
          import 'package:intl/intl.dart';

          class ImportExportScreen extends StatefulWidget {
            const ImportExportScreen({super.key});
            @override
            State<ImportExportScreen> createState() => _ImportExportState();
          }

          class _ImportExportState extends State<ImportExportScreen> {
            String status = 'Ready - Local-only';
            String preview = '';

            Future<void> exportFile() async {
              final cores = await StorageService.getList('cores');
              final report = 'WanaLab v3.4 FULL\nDate: ${DateFormat('yyyy-MM-dd HH:mm').format(DateTime.now())}\n${cores.join('\n')}';
              final dir = await getTemporaryDirectory();
              final file = File('${dir.path}/Export.txt');
              await file.writeAsString(report);
              setState(() { status = 'Exported'; preview = report; });
              await Share.shareXFiles([XFile(file.path)]);
            }

            Future<void> importFile() async {
              try {
                FilePickerResult? r = await FilePicker.platform.pickFiles();
                if (r != null) {
                  File f = File(r.files.single.path!);
                  String c = await f.readAsString();
                  setState(() { status = 'Imported'; preview = c.substring(0, c.length > 800 ? 800 : c.length); });
                }
              } catch (e) {
                setState(() => status = 'Failed $e');
              }
            }

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(12),
                children: [
                  Card(child: Padding(padding: const EdgeInsets.all(10), child: Text(status))),
                  FilledButton.icon(onPressed: exportFile, icon: const Icon(Icons.file_present), label: const Text('EXPORT TXT Local-only')),
                  FilledButton.tonalIcon(onPressed: importFile, icon: const Icon(Icons.file_upload), label: const Text('IMPORT File Local-only')),
                  Container(padding: const EdgeInsets.all(8), color: Colors.grey.shade100, child: SelectableText(preview.isEmpty ? 'No data' : preview)),
                ],
              );
            }
          }
          DART

          echo "=== lib tree ==="
          find lib -name '*.dart' | sort
          flutter pub get
          flutter analyze --no-fatal-infos || true
          flutter build apk --release --no-tree-shake-icons --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-v3.4-FULL-FIXED-R8-NDK
          path: build/app/outputs/flutter-apk/app-release.apk
