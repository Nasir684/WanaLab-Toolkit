name: WanaLab-FINAL-Clean-Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Purge wrong EMI paths only
        run: |
          rm -rf kotlin/ build/ .dart_tool/ || true
          ls -la

      - name: Recreate standard Android project
        run: |
          flutter create --platforms=android --org com.wanalab --project-name wanalab_toolkit . --overwrite
          ls android/app/src/main/kotlin/com/wanalab/toolkit/

      - name: Build clean APK
        run: |
          flutter pub get
          flutter build apk --debug --build-name=2.1.0 --build-number=19

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: WanaLab-FINAL-FIXED-19-NO-BUG
          path: build/app/outputs/flutter-apk/app-debug.apk
