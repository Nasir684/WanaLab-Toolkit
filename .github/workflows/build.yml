name: WanaLab-Toolkit-VarRho-Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VarRho Engine
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build VarRho Engine APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload VarRho APK
        uses: actions/upload-artifact@v4
        with:
          name: WanaLab-VarRho-Engine-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Info
        run: |
          echo "VarRho Engine v1.0 - IEEE ASTM Research"
          echo "GitHub: https://github.com/Nasir684/WanaLab-Toolkit"
          echo "Build: 2.1.0-VarRho"
