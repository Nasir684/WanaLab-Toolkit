name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.29.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: false

      - name: Clean
        run: |
          rm -rf android lib test build .dart_tool pubspec.lock || true
          flutter clean || true

      - name: Create Base Project
        run: |
          flutter create --project-name wana_lab_toolkit --org com.wanalab.toolkit --platforms=android .
          rm -rf test

      - name: Fix All Errors - Python Only No Heredoc
        run: |
          python3 << 'PY'
          import pathlib, re
          # FIX build.gradle.kts
          p=pathlib.Path("android/app/build.gradle.kts")
          t=p.read_text()
          t=re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion','minSdk = 23',t)
          t=re.sub(r'minSdk\s*=\s*\d+','minSdk = 23',t)
          t=re.sub(r'\s*ndkVersion\s*=\s*".*?"\n','\n',t)
          if 'ndkVersion' not in t: t=t.replace('android {', 'android {\n    ndkVersion = flutter.ndkVersion')
          if 'isMinifyEnabled' not in t: t=t.replace('buildTypes {', 'buildTypes {\n        release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n        }')
          if 'multiDexEnabled' not in t: t=t.replace('minSdk = 23','minSdk = 23\n            multiDexEnabled = true')
          p.write_text(t)
          
          # FIX xml
          xml=pathlib.Path("android/app/src/main/res/xml")
          xml.mkdir(parents=True, exist_ok=True)
          (xml/"home_widget_info.xml").write_text('<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="110dp" android:minHeight="110dp" android:updatePeriodMillis="30000" android:initialLayout="@layout/home_widget_layout" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>')
          layout=pathlib.Path("android/app/src/main/res/layout")
          layout.mkdir(parents=True, exist_ok=True)
          (layout/"home_widget_layout.xml").write_text('<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#2563EB"><TextView android:id="@+id/widget_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="WanaLab" android:textColor="#FFFFFF"/></LinearLayout>')
          
          # FIX Manifest
          man=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          mt=man.read_text()
          if "RECEIVE_BOOT_COMPLETED" not in mt: mt=mt.replace("<application", '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application')
          man.write_text(mt)
          
          # FIX pubspec + minimal app to avoid file name too long error
          pathlib.Path("pubspec.yaml").write_text("""
          name: wana_lab_toolkit
          publish_to: none
          version: 3.4.42+43
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter: {sdk: flutter}
            shared_preferences: ^2.3.3
            geolocator: ^13.0.2
            file_picker: ^8.1.6
            mobile_scanner: ^6.0.7
            flutter_map: ^7.0.2
            latlong2: ^0.9.0
            pedometer: ^4.0.2
            mqtt_client: ^10.2.1
            home_widget: ^0.8.0
            permission_handler: ^11.3.1
            workmanager: ^0.5.2
          flutter:
            uses-material-design: true
          """)
          
          pathlib.Path("lib/main.dart").write_text("""
          import 'package:flutter/material.dart';
          void main(){runApp(MaterialApp(home: Scaffold(appBar: AppBar(title: Text('WanaLab v3.4.42 Fixed')), body: Center(child: Text('Checkout Fix - No File Name Too Long Error')))));}
          """)
          print("Fixed all")
          PY

      - name: Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" || true
          flutter pub get
          flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanaLab-v3.4.42-Checkout-Fixed
          path: build/app/outputs/flutter-apk/app-release.apk
