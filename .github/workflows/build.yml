name: WanaLab-FINAL-Clean-Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enable long paths and checkout
        run: |
          git config --global core.longpaths true
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git config --global --add safe.directory $(pwd)

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Clean old builds
        run: |
          rm -rf build/
          rm -rf .dart_tool/
      
      - name: Build clean APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: WanaLab-APK-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
