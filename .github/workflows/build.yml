          cat > lib/features/religion/qibla_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';
          import 'dart:math';
          class QiblaScreen extends StatefulWidget { const QiblaScreen({super.key}); @override State<QiblaScreen> createState()=> _QiblaState();}
          class _QiblaState extends State<QiblaScreen> { double q=0; String loc='Getting...'; @override void initState(){ super.initState(); _get();} Future<void> _get() async { try{ final pos=await Geolocator.getCurrentPosition(); const kaabaLat=21.4225; const kaabaLong=39.8262; double lat1=pos.latitude*pi/180; double long1=pos.longitude*pi/180; double lat2=kaabaLat*pi/180; double long2=kaabaLong*pi/180; double dLong=long2-long1; double y=sin(dLong)*cos(lat2); double x=cos(lat1)*sin(lat2)-sin(lat1)*cos(lat2)*cos(dLong); double qq=atan2(y,x)*180/pi; qq=(qq+360)%360; if(mounted) setState((){ q=qq; loc='Qibla: ${q.toStringAsFixed(1)}°'; }); }catch(e){ if(mounted) setState(()=> loc='Enable GPS');}} @override Widget build(BuildContext context){ return ListView(padding: const EdgeInsets.all(16), children:[ Text(loc, textAlign: TextAlign.center), Center(child: Icon(Icons.navigation, size:120, color: Colors.green)), Center(child: Text('${q.toStringAsFixed(1)}°')) ]); } }
