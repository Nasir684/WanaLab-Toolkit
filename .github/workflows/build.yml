name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Download (skip 1 broken file)
        run: |
          python3 - << 'PY'
          import tarfile, urllib.request, os
          url="https://github.com/Nasir684/WanaLab-Toolkit/archive/main.tar.gz"
          urllib.request.urlretrieve(url,"r.tar.gz")
          with tarfile.open("r.tar.gz","r:gz") as tar:
            for m in tar.getmembers():
              if "/" not in m.name: continue
              inner=m.name.split("/",1)[1]
              if "\n" in inner or '"' in inner or "content" in inner or len(inner)>120: continue
              if not (inner.startswith("lib/") or inner=="pubspec.yaml"): continue
              if not m.isfile(): continue
              d=os.path.dirname(inner)
              if d: os.makedirs(d,exist_ok=True)
              try: open(inner,"wb").write(tar.extractfile(m).read())
              except: pass
          PY

      - name: Fix pubspec - use latest compatible
        run: |
          cat > pubspec.yaml << 'YAML'
          name: wana_lab_toolkit
          description: WanaLab Toolkit
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            url_launcher: ^6.2.6
            geolocator: ^13.0.2
            geocoding: ^3.0.0
            permission_handler: ^11.3.1
            http: ^1.2.2
            shared_preferences: ^2.3.3
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
          flutter:
            uses-material-design: true
          YAML
          rm -rf android pubspec.lock
          flutter create --project-name wana_lab_toolkit --org com.example.wanalab --platforms=android .
          flutter pub get
          flutter pub deps | grep geolocator

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-APK
          path: build/app/outputs/flutter-apk/app-release.apk
