          cat > lib/features/varrho_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          class VarRhoScreen extends StatefulWidget { const VarRhoScreen({super.key}); @override State<VarRhoScreen> createState()=>_V(); }
          class _V extends State<VarRhoScreen> { final rho=TextEditingController(text:'1.5'), varc=TextEditingController(text:'0.1'); double result=0; void calc(){ double r=double.tryParse(rho.text)??0; double v=double.tryParse(varc.text)??0; result=r*(1+v); setState((){}); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [TextField(controller: rho, decoration: const InputDecoration(labelText:'Rho (g/cc)', border: OutlineInputBorder()), keyboardType: TextInputType.number), const SizedBox(height:8), TextField(controller: varc, decoration: const InputDecoration(labelText:'Var correction (0.1=10%)', border: OutlineInputBorder()), keyboardType: TextInputType.number), const SizedBox(height:12), FilledButton(onPressed: calc, child: const Text('Correct Rho')), Card(child: Padding(padding: const EdgeInsets.all(24), child: Center(child: Text('${result.toStringAsFixed(4)} g/cc', style: const TextStyle(fontSize:24, fontWeight: FontWeight.bold)))))]); } }
          DART

          cat > lib/features/import_export_screen.dart << 'DART'
          import 'package:flutter/material.dart'; import '../services/storage_service.dart'; import 'package:share_plus/share_plus.dart';
          class ImportExportScreen extends StatefulWidget { const ImportExportScreen({super.key}); @override State<ImportExportScreen> createState()=>_I(); }
          class _I extends State<ImportExportScreen> { String data=''; Future<void> exportAll() async { final cores=await StorageService.getList('cores'); final gps=await StorageService.getList('gps'); final baby=await StorageService.getList('baby'); final work=await StorageService.getList('workshop'); if(!mounted) return; setState(()=>data='=== WanaLab Export ===\nDate: ${DateTime.now()}\n\nCORES:\n${cores.join('\n')}\n\nGPS:\n${gps.join('\n')}\n\nBABY:\n${baby.join('\n')}\n\nWORKSHOP:\n${work.join('\n')}'); } Future<void> clear() async { await StorageService.clearAll(); if(!mounted) return; setState(()=>data='All data cleared!'); } @override Widget build(BuildContext c){ return ListView(padding: const EdgeInsets.all(16), children: [FilledButton.icon(onPressed: exportAll, icon: const Icon(Icons.download), label: const Text('Generate Full Report')), const SizedBox(height:8), Row(children: [Expanded(child: OutlinedButton.icon(onPressed: ()=>Share.share(data), icon: const Icon(Icons.share), label: const Text('Share Report'))), const SizedBox(width:8), Expanded(child: OutlinedButton.icon(onPressed: clear, icon: const Icon(Icons.delete, color: Colors.red), label: const Text('Clear All', style: TextStyle(color: Colors.red))))]), const SizedBox(height:16), SelectableText(data)]); } }
          DART

