name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VarRho Engine
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build VarRho Engine APK
        run: flutter build apk --debug --build-name=2.1.0 --build-number=16

      - name: Upload VarRho APK
        uses: actions/upload-artifact@v4
        with:
          name: wanalab-toolkit-v2.1.0-varrho-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build Info
        run: |
          echo "WanaLab Toolkit v2.1.0+16 VarRho Engine"
          echo "Built in Wana - For Engineers Everywhere"
          echo "Author: Nasir Khan"
