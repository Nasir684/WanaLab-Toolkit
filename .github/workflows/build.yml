name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Create all dart files
        run: |
          python3 << 'PY'
          import os
          # Example - do this for all 24 files
          os.makedirs("lib/screens", exist_ok=True)
          
          # Use triple quotes in python, so 'https:' inside is safe
          code = """
          import 'package:flutter/material.dart';
          import 'package:url_launcher/url_launcher.dart';
          
          class MyWidget extends StatelessWidget {
            void _open(String url) async {
              final uri = Uri.parse(url);
              await launchUrl(uri);
            }
            
            @override
            Widget build(BuildContext context) {
              return ElevatedButton.icon(
                onPressed: () => _open('https://google.com'),
                icon: Icon(Icons.open_in_new),
                label: Text('Open'),
              );
            }
          }
          """
          open("lib/screens/my_screen.dart", "w").write(code)
          PY

      - name: Build APK
        run: flutter build apk --release
