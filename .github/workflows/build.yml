name: test-build
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Recreate android if missing
        run: |
          if [ ! -d "android" ]; then
            rm -rf ios linux macos windows web
            flutter create . --project-name wana_lab_toolkit --platforms android
            echo "android recreated"
          else
            echo "android exists"
          fi

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: WanaLab-Build-Test
          path: build/app/outputs/flutter-apk/app-release.apk
