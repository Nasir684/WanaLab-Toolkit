          class BarcodeScreen extends StatefulWidget { const BarcodeScreen({super.key}); @override State<BarcodeScreen> createState()=> _BarcodeState(); }
          class _BarcodeState extends State<BarcodeScreen> { String res='Scan barcode/QR Local-only'; MobileScannerController ctrl=MobileScannerController(); @override Widget build(BuildContext context){ return Column(children:[ Expanded(flex:3, child: MobileScanner(controller: ctrl, onDetect:(cap){ final b=cap.barcodes.first.rawValue; if(b!=null){ setState(()=> res=b); ctrl.stop(); }})), Expanded(flex:2, child: Padding(padding: const EdgeInsets.all(12), child: Column(children:[ Card(child: Padding(padding: const EdgeInsets.all(10), child: Text(res))), FilledButton(onPressed: (){ setState(()=> res='Scan...'); ctrl.start(); }, child: const Text('Scan Again')), OutlinedButton.icon(onPressed: ()=> Share.share(res), icon: const Icon(Icons.share), label: const Text('Share')) ]))) ]); } }
